# ArgoCD Application — ai-stack (lab environment)
# Deploy with: kubectl apply -f argocd/application-lab.yaml
# Requires: ArgoCD v3.3.2+ installed + repo credentials configured
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-stack-lab
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-stack
    assurance.platform/tier: "T1"
    assurance.platform/profile: lab
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default  # Use a dedicated AppProject in production
  source:
    repoURL: https://github.com/rmednitzer/ai-stack.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values.yaml
      # Pass parameters that may differ per cluster
      parameters: []
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # Ignore differences injected by admission controllers or operators
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    # K10 Policy CRD — ignore status updates from Kasten controller
    - group: config.kio.kasten.io
      kind: Policy
      jsonPointers:
        - /status
  revisionHistoryLimit: 5
