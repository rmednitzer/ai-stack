{{- if .Values.pipelines.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pipelines") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pipelines") | nindent 4 }}
    assurance.platform/tier: "T1"
    assurance.platform/boundary: "decision"
spec:
  replicas: {{ .Values.pipelines.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pipelines") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pipelines") | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pipelines") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "ai-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "pipelines" "replicaCount" .Values.pipelines.replicaCount) | nindent 6 }}
      initContainers:
        {{- if .Values.ollama.enabled }}
        {{- include "ai-stack.waitFor" (dict "name" "ollama" "host" (include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "ollama")) "port" .Values.ollama.service.port) | nindent 8 }}
        {{- end }}
      containers:
        - name: pipelines
          image: "{{ .Values.pipelines.image.repository }}:{{ .Values.pipelines.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 9099
              protocol: TCP
          env:
            {{- range $key, $value := .Values.pipelines.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.qdrant.enabled }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "qdrant") }}-secret
                  key: api-key
            {{- end }}
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "pipelines") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.pipelines.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
          {{- with .Values.pipelines.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.pipelines.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.pipelines.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.pipelines.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pipelines") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pipelines") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pipelines") | nindent 4 }}
spec:
  type: {{ .Values.pipelines.service.type }}
  ports:
    - port: {{ .Values.pipelines.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pipelines") | nindent 4 }}
{{- if .Values.pipelines.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pipelines") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.pipelines.persistence.accessMode }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.pipelines.persistence.size }}
{{- end }}
{{- end }}
