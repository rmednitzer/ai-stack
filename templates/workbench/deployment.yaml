{{- if .Values.workbench.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "workbench") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "workbench") | nindent 4 }}
    assurance.platform/tier: "T1"
    assurance.platform/boundary: "decision"
spec:
  replicas: {{ .Values.workbench.replicaCount }}
  strategy:
    type: Recreate  # GPU workload — avoid double-scheduling
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "workbench") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "workbench") | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "workbench") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Install additional Python packages at startup
        # For production, bake these into a custom image instead
        {{- if .Values.workbench.env.PIP_PACKAGES }}
        - name: install-packages
          image: "{{ .Values.workbench.image.repository }}:{{ .Values.workbench.image.tag }}"
          command:
            - sh
            - -c
            - |
              pip install --user --no-cache-dir ${PIP_PACKAGES} 2>&1 | tail -5
              echo "Package installation complete"
          env:
            - name: PIP_PACKAGES
              value: {{ .Values.workbench.env.PIP_PACKAGES | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: work
              mountPath: /home/jovyan/work
            - name: pip-cache
              mountPath: /home/jovyan/.local
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
        {{- end }}
      containers:
        - name: workbench
          image: "{{ .Values.workbench.image.repository }}:{{ .Values.workbench.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "ai-stack.restrictedSecurityContext" (dict "readOnlyRootFilesystem" false "runAsUser" 1000) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          env:
            {{- range $key, $value := .Values.workbench.env }}
            {{- if ne $key "PIP_PACKAGES" }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- end }}
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "workbench") }}-secret
                  key: token
            {{- include "ai-stack.qdrantApiKeyEnv" . | nindent 12 }}
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "workbench") | nindent 12 }}
          args:
            - start-notebook.py
            - "--NotebookApp.base_url=/"
            - "--ServerApp.allow_origin=*"
            - "--IdentityProvider.token=$(JUPYTER_TOKEN)"
          volumeMounts:
            - name: work
              mountPath: {{ .Values.workbench.persistence.mountPath }}
            - name: pip-cache
              mountPath: /home/jovyan/.local
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api
              port: http
            failureThreshold: 40
            periodSeconds: 5
          {{- with .Values.workbench.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workbench.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- $res := deepCopy .Values.workbench.resources }}
            {{- if .Values.workbench.gpu.enabled }}
            {{- $_ := set $res.limits (.Values.workbench.gpu.resourceName) (.Values.workbench.gpu.count | int) }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
      volumes:
        - name: work
          {{- if .Values.workbench.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "workbench") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: pip-cache
          emptyDir:
            sizeLimit: 10Gi
        # /dev/shm — shared memory for PyTorch DataLoader multi-worker
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.workbench.shmSize | default "8Gi" }}
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "workbench") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "workbench") | nindent 4 }}
spec:
  type: {{ .Values.workbench.service.type }}
  ports:
    - port: {{ .Values.workbench.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "workbench") | nindent 4 }}
{{- if .Values.workbench.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "workbench") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "workbench") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.workbench.persistence.accessMode }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workbench.persistence.size }}
{{- end }}
{{- include "ai-stack.ingress" (dict "root" . "component" "workbench" "ingress" .Values.workbench.ingress) }}
{{- end }}
