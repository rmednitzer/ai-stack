{{- if .Values.authelia.enabled }}
{{/*
Authelia configuration rendered as a ConfigMap.
Secrets (JWT, session, storage encryption, OIDC HMAC) are injected via
environment variables that Authelia reads at startup using _FILE suffix.
The OIDC client secret uses the $plaintext$ prefix to avoid hashing in templates.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}-config
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
data:
  configuration.yml: |
    theme: light
    server:
      address: tcp://0.0.0.0:9091
    log:
      level: info
    authentication_backend:
      file:
        path: /config/users_database.yml
    session:
      cookies:
        - domain: {{ .Values.authelia.domain | quote }}
          authelia_url: {{ .Values.authelia.oidc.issuerUrl | quote }}
      {{- if .Values.valkey.enabled }}
      redis:
        host: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}
        port: {{ .Values.valkey.service.port }}
      {{- end }}
    {{- if eq .Values.authelia.storage "postgres" }}
    storage:
      postgres:
        address: tcp://{{ include "ai-stack.postgresHost" . }}:{{ include "ai-stack.postgresPort" . }}
        database: {{ .Values.postgres.database }}
        username: {{ .Values.postgres.user }}
        schema: authelia
    {{- else }}
    storage:
      local:
        path: /config/db.sqlite3
    {{- end }}
    access_control:
      default_policy: {{ .Values.authelia.defaultPolicy }}
    identity_providers:
      oidc:
        clients:
          - client_id: {{ .Values.authelia.oidc.clientId | quote }}
            client_name: Open WebUI
            client_secret: $plaintext$${AUTHELIA_OIDC_CLIENT_SECRET}
            public: false
            authorization_policy: {{ .Values.authelia.defaultPolicy }}
            redirect_uris:
              - {{ printf "%s/oauth/oidc/callback" (trimSuffix "/" (index .Values.openwebui.ingress.hosts 0).host | default "https://ai.example.local") | quote }}
            scopes:
              {{- range .Values.authelia.oidc.scopes }}
              - {{ . }}
              {{- end }}
            response_types:
              - code
            grant_types:
              - authorization_code
            token_endpoint_auth_method: client_secret_post
  users_database.yml: |
    # Default empty users database.
    # Override by mounting a custom users_database.yml or configure LDAP.
    # Generate password hashes with: authelia crypto hash generate argon2
    users: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 4 }}
    assurance.platform/tier: "T0"
    assurance.platform/boundary: "authentication"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/authelia/deployment.yaml") . | sha256sum }}
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- if .Values.valkey.enabled }}
        {{- include "ai-stack.waitFor" (dict "name" "valkey" "host" (include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey")) "port" .Values.valkey.service.port) | nindent 8 }}
        {{- end }}
      containers:
        - name: authelia
          image: "{{ .Values.authelia.image.repository }}:{{ .Values.authelia.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "ai-stack.restrictedSecurityContext" (dict "readOnlyRootFilesystem" false "runAsUser" 1000) | nindent 12 }}
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          env:
            - name: AUTHELIA_JWT_SECRET_FILE
              value: /secrets/jwt-secret
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/session-secret
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/storage-encryption-key
            - name: AUTHELIA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}-secret
                  key: oidc-client-secret
            {{- if and (eq .Values.authelia.storage "postgres") .Values.postgres.enabled }}
            - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
              value: /secrets/pg-password
            {{- end }}
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "authelia") | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config/configuration.yml
              subPath: configuration.yml
              readOnly: true
            - name: config
              mountPath: /config/users_database.yml
              subPath: users_database.yml
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: data
              mountPath: {{ .Values.authelia.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 20
            periodSeconds: 5
          {{- with .Values.authelia.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.authelia.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.authelia.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}-config
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}-secret
                  items:
                    - key: jwt-secret
                      path: jwt-secret
                    - key: session-secret
                      path: session-secret
                    - key: storage-encryption-key
                      path: storage-encryption-key
              {{- if and (eq .Values.authelia.storage "postgres") .Values.postgres.enabled }}
              - secret:
                  name: {{ include "ai-stack.postgresSecretName" . }}
                  items:
                    - key: {{ include "ai-stack.postgresSecretKey" . }}
                      path: pg-password
              {{- end }}
        - name: data
          {{- if .Values.authelia.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 4 }}
spec:
  type: {{ .Values.authelia.service.type }}
  ports:
    - port: {{ .Values.authelia.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 4 }}
{{- if .Values.authelia.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.authelia.persistence.accessMode }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.authelia.persistence.size }}
{{- end }}
{{- include "ai-stack.ingress" (dict "root" . "component" "authelia" "ingress" .Values.authelia.ingress) }}
{{- end }}
