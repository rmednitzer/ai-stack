{{- if .Values.authelia.enabled }}
{{/*
Authelia Deployment. The configuration ConfigMap lives in configmap.yaml
so the checksum annotation below can reference it without self-recursion.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 4 }}
    {{- include "ai-stack.governanceLabels" "authelia" | nindent 4 }}
  annotations:
    {{- include "ai-stack.governanceControlRefs" "authelia" | nindent 4 }}
spec:
  {{- if .Values.authelia.persistence.enabled }}
  # Single-replica component on an RWO PVC: Recreate avoids a rollout deadlock
  # where the new pod cannot mount the volume still held by the old pod.
  strategy:
    type: Recreate
    # null clears a rollingUpdate field defaulted by a prior RollingUpdate so the
    # upgrade patch stays valid (rollingUpdate is forbidden with type: Recreate).
    rollingUpdate: null
  {{- end }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 8 }}
        {{- include "ai-stack.governanceLabels" "authelia" | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/authelia/configmap.yaml") . | sha256sum }}
        {{- include "ai-stack.governanceControlRefs" "authelia" | nindent 8 }}
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authelia
          image: "{{ .Values.authelia.image.repository }}:{{ .Values.authelia.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "ai-stack.restrictedSecurityContext" (dict "readOnlyRootFilesystem" false "runAsUser" 1000) | nindent 12 }}
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
            {{- if .Values.authelia.metrics.enabled }}
            - name: metrics
              containerPort: 9959
              protocol: TCP
            {{- end }}
          env:
            # Enable the `template` config filter so the OIDC client secret is read
            # from a mounted file via the `secret` function (see configmap +
            # ADR-016). Authelia's legacy ${VAR} expansion is off by default and
            # `expand-env` is deprecated (removed in v4.40), so file+template is the
            # forward-looking path and keeps the secret out of the pod env and the
            # rendered manifest.
            - name: X_AUTHELIA_CONFIG_FILTERS
              value: template
            - name: AUTHELIA_JWT_SECRET_FILE
              value: /secrets/jwt-secret
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/session-secret
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/storage-encryption-key
            {{- if and (eq .Values.authelia.storage "postgres") .Values.postgres.enabled }}
            - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
              value: /secrets/pg-password
            {{- end }}
            {{- if include "ai-stack.valkeyAuthEnabled" . }}
            {{- /* session.redis.password for the Valkey session store (ADR-008) */}}
            - name: AUTHELIA_SESSION_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}-secret
                  key: password
            {{- end }}
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "authelia") | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config/configuration.yml
              subPath: configuration.yml
              readOnly: true
            - name: config
              mountPath: /config/users_database.yml
              subPath: users_database.yml
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: data
              mountPath: {{ .Values.authelia.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 20
            periodSeconds: 5
          {{- with .Values.authelia.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.authelia.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.authelia.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}-config
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}-secret
                  items:
                    - key: jwt-secret
                      path: jwt-secret
                    - key: session-secret
                      path: session-secret
                    - key: storage-encryption-key
                      path: storage-encryption-key
                    - key: oidc-client-secret
                      path: oidc-client-secret
              {{- if and (eq .Values.authelia.storage "postgres") .Values.postgres.enabled }}
              - secret:
                  name: {{ include "ai-stack.postgresSecretName" . }}
                  items:
                    - key: {{ include "ai-stack.postgresSecretKey" . }}
                      path: pg-password
              {{- end }}
        - name: data
          {{- if .Values.authelia.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 4 }}
spec:
  type: {{ .Values.authelia.service.type }}
  ports:
    - port: {{ .Values.authelia.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.authelia.metrics.enabled }}
    - port: 9959
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 4 }}
{{- if .Values.authelia.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.authelia.persistence.accessMode }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.authelia.persistence.size }}
{{- end }}
{{- include "ai-stack.ingress" (dict "root" . "component" "authelia" "ingress" .Values.authelia.ingress) }}
{{- include "ai-stack.httpRoute" (dict "root" . "component" "authelia" "httpRoute" .Values.authelia.httpRoute "servicePort" .Values.authelia.service.port) }}
{{- end }}
