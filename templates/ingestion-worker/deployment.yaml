{{- if .Values.ingestionWorker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "ingestion-worker") }}-script
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "ingestion-worker") | nindent 4 }}
data:
  # worker.py and requirements.txt are maintained as real source files under
  # files/ingestion-worker/ (lintable, testable, syntax-highlighted) and loaded
  # here via .Files.Get rather than inlined in this template. The deployment's
  # checksum/config annotation hashes these files so pods roll when code changes.
  worker.py: |
{{ .Files.Get "files/ingestion-worker/worker.py" | indent 4 }}
  requirements.txt: |
{{ .Files.Get "files/ingestion-worker/requirements.txt" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "ingestion-worker") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "ingestion-worker") | nindent 4 }}
    {{- include "ai-stack.governanceLabels" "ingestion-worker" | nindent 4 }}
  annotations:
    {{- include "ai-stack.governanceControlRefs" "ingestion-worker" | nindent 4 }}
    {{- include "ai-stack.syncWave" "app" | nindent 4 }}
spec:
  {{- if not (include "ai-stack.autoscalingEnabled" .Values.ingestionWorker) }}
  replicas: {{ .Values.ingestionWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "ingestion-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "ingestion-worker") | nindent 8 }}
        {{- include "ai-stack.governanceLabels" "ingestion-worker" | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        {{- include "ai-stack.governanceControlRefs" "ingestion-worker" | nindent 8 }}
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
        checksum/config: {{ printf "%s%s%s" (.Files.Get "files/ingestion-worker/worker.py") (.Files.Get "files/ingestion-worker/requirements.txt") (toJson .Values.ingestionWorker.env) | sha256sum }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "ingestion-worker") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "ai-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "ingestion-worker" "replicaCount" .Values.ingestionWorker.replicaCount "autoscaling" (include "ai-stack.autoscalingEnabled" .Values.ingestionWorker)) | nindent 6 }}
      {{- if or .Values.valkey.enabled .Values.ingestionWorker.buildDeps }}
      initContainers:
        {{- if .Values.valkey.enabled }}
        - name: init-valkey-stream
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              STREAM="{{ index .Values.ingestionWorker.env "INGESTION_STREAM" | default "ingestion:documents" }}"
              GROUP="{{ index .Values.ingestionWorker.env "INGESTION_CONSUMER_GROUP" | default "ingestion-workers" }}"
              valkey-cli -h "{{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}" \
                -p {{ .Values.valkey.service.port }} \
                XGROUP CREATE "$STREAM" "$GROUP" 0 MKSTREAM 2>/dev/null || true
              echo "Stream '$STREAM' and consumer group '$GROUP' ready."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        {{- end }}
        {{- if .Values.ingestionWorker.buildDeps }}
        - name: install-deps
          image: "{{ .Values.ingestionWorker.image.repository }}:{{ .Values.ingestionWorker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              pip install --no-cache-dir --target=/deps -r /scripts/requirements.txt{{- if and .Values.ingestionWorker.sources.enabled .Values.ingestionWorker.sources.pipPackages }}{{- range .Values.ingestionWorker.sources.pipPackages }} '{{ . }}'{{- end }}{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: deps
              mountPath: /deps
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        {{- end }}
      {{- end }}
      containers:
        - name: ingestion-worker
          image: "{{ .Values.ingestionWorker.image.repository }}:{{ .Values.ingestionWorker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "ai-stack.restrictedSecurityContext" (dict "readOnlyRootFilesystem" true "runAsUser" 1000) | nindent 12 }}
          command: ['python', '/scripts/worker.py']
          env:
            {{- if .Values.ingestionWorker.buildDeps }}
            - name: PYTHONPATH
              value: "/deps"
            {{- end }}
            - name: VALKEY_URL
              value: 'redis://{{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}:{{ .Values.valkey.service.port }}'
            {{- if and .Values.ingestionWorker.sources.enabled .Values.ingestionWorker.sources.schemes }}
            - name: INGESTION_SOURCE_SCHEMES
              value: {{ join "," .Values.ingestionWorker.sources.schemes | quote }}
            {{- end }}
            {{- range $key, $value := .Values.ingestionWorker.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- include "ai-stack.qdrantApiKeyEnv" . | nindent 12 }}
            {{- if .Values.postgres.enabled }}
            - name: _PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.postgresSecretName" . }}
                  key: {{ include "ai-stack.postgresSecretKey" . }}
            - name: POSTGRES_URI
              value: {{ include "ai-stack.postgresURI" . | quote }}
            {{- end }}
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "ingestion-worker") | nindent 12 }}
          {{- if and .Values.ingestionWorker.sources.enabled .Values.ingestionWorker.sources.existingSecret }}
          envFrom:
            # Credentials for the fsspec source backends (ADR-007). The Secret's
            # keys become env vars the backends read (AWS_*, AZURE_STORAGE_*, …).
            - secretRef:
                name: {{ .Values.ingestionWorker.sources.existingSecret }}
          {{- end }}
          startupProbe:
            exec:
              command: ['test', '-f', '/tmp/healthy']
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['test', '-f', '/tmp/healthy']
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ['test', '-f', '/tmp/healthy']
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            {{- if .Values.ingestionWorker.buildDeps }}
            - name: deps
              mountPath: /deps
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          {{- with .Values.ingestionWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "ingestion-worker") }}-script
        {{- if .Values.ingestionWorker.buildDeps }}
        - name: deps
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
{{- end }}
