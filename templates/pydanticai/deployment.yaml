{{- if .Values.pydanticai.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pydanticai") }}-app
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pydanticai") | nindent 4 }}
data:
  # app.py and requirements.txt are maintained as real source files under
  # files/pydanticai/ and loaded via .Files.Get. The deployment's checksum/config
  # annotation hashes them so pods roll when the agent code changes.
  app.py: |
{{ .Files.Get "files/pydanticai/app.py" | indent 4 }}
  requirements.txt: |
{{ .Files.Get "files/pydanticai/requirements.txt" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pydanticai") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pydanticai") | nindent 4 }}
    {{- include "ai-stack.governanceLabels" "pydanticai" | nindent 4 }}
  annotations:
    {{- include "ai-stack.governanceControlRefs" "pydanticai" | nindent 4 }}
    {{- include "ai-stack.syncWave" "app" | nindent 4 }}
spec:
  {{- if not (include "ai-stack.autoscalingEnabled" .Values.pydanticai) }}
  replicas: {{ .Values.pydanticai.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pydanticai") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pydanticai") | nindent 8 }}
        {{- include "ai-stack.governanceLabels" "pydanticai" | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        {{- include "ai-stack.governanceControlRefs" "pydanticai" | nindent 8 }}
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
        checksum/config: {{ printf "%s%s%s" (.Files.Get "files/pydanticai/app.py") (.Files.Get "files/pydanticai/requirements.txt") (toJson .Values.pydanticai.env) | sha256sum }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pydanticai") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      {{- include "ai-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "pydanticai" "replicaCount" .Values.pydanticai.replicaCount "autoscaling" (include "ai-stack.autoscalingEnabled" .Values.pydanticai)) | nindent 6 }}
      {{- if .Values.pydanticai.buildDeps }}
      initContainers:
        - name: install-deps
          image: "{{ .Values.pydanticai.image.repository }}:{{ .Values.pydanticai.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ['sh', '-c', 'uv pip install --target=/deps --require-hashes -r /app/requirements.txt']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: deps
              mountPath: /deps
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      {{- end }}
      containers:
        - name: pydanticai
          image: "{{ .Values.pydanticai.image.repository }}:{{ .Values.pydanticai.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "ai-stack.restrictedSecurityContext" (dict "readOnlyRootFilesystem" true "runAsUser" 1000) | nindent 12 }}
          workingDir: /app
          command: ['python', '-m', 'uvicorn', 'app:app', '--host', '0.0.0.0', '--port', '8000']
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- if .Values.pydanticai.buildDeps }}
            - name: PYTHONPATH
              value: "/deps"
            {{- end }}
            {{- range $key, $value := .Values.pydanticai.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- include "ai-stack.qdrantApiKeyEnv" . | nindent 12 }}
            - name: PYDANTICAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pydanticai") }}-secret
                  key: api-key
            {{- if .Values.postgres.enabled }}
            - name: _PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.postgresSecretName" . }}
                  key: {{ include "ai-stack.postgresSecretKey" . }}
            - name: POSTGRES_URI
              value: {{ include "ai-stack.postgresURI" . | quote }}
            {{- end }}
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "pydanticai") | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          {{- with .Values.pydanticai.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.pydanticai.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            {{- if .Values.pydanticai.buildDeps }}
            - name: deps
              mountPath: /deps
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          {{- with .Values.pydanticai.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: app
          configMap:
            name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pydanticai") }}-app
        {{- if .Values.pydanticai.buildDeps }}
        - name: deps
          # Bounded like the `tmp` sibling: caps the uv pip install target so a
          # runaway or compromised install cannot exhaust node ephemeral storage.
          # 1Gi is ample for the agent's resolved deps (~300-500Mi); raise it only
          # if you vendor heavier wheels (ADR-016).
          emptyDir:
            sizeLimit: 1Gi
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pydanticai") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pydanticai") | nindent 4 }}
spec:
  type: {{ .Values.pydanticai.service.type }}
  ports:
    - port: {{ .Values.pydanticai.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "pydanticai") | nindent 4 }}
{{- include "ai-stack.ingress" (dict "root" . "component" "pydanticai" "ingress" .Values.pydanticai.ingress) }}
{{- include "ai-stack.httpRoute" (dict "root" . "component" "pydanticai" "httpRoute" .Values.pydanticai.httpRoute "servicePort" .Values.pydanticai.service.port) }}
{{- end }}
