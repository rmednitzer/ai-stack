{{- if .Values.langgraph.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "langgraph") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "langgraph") | nindent 4 }}
    assurance.platform/tier: "T1"
    assurance.platform/boundary: "decision"
  annotations:
    {{- include "ai-stack.syncWave" "app" | nindent 4 }}
spec:
  {{- if .Values.langgraph.persistence.enabled }}
  # RWO PVC: Recreate avoids a rollout deadlock on the single attached volume
  # (persistence and autoscaling are mutually exclusive — RWO cannot multi-attach).
  strategy:
    type: Recreate
  {{- end }}
  {{- if not (include "ai-stack.autoscalingEnabled" .Values.langgraph) }}
  replicas: {{ .Values.langgraph.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "langgraph") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "langgraph") | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "langgraph") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      {{- include "ai-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "langgraph" "replicaCount" .Values.langgraph.replicaCount "autoscaling" (include "ai-stack.autoscalingEnabled" .Values.langgraph)) | nindent 6 }}
      containers:
        - name: langgraph
          image: "{{ .Values.langgraph.image.repository }}{{- if .Values.langgraph.image.digest }}@{{ .Values.langgraph.image.digest }}{{- else }}:{{ .Values.langgraph.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "ai-stack.restrictedSecurityContext" (dict "readOnlyRootFilesystem" false "runAsUser" 1000) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.langgraph.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: _PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.postgresSecretName" . }}
                  key: {{ include "ai-stack.postgresSecretKey" . }}
            - name: POSTGRES_URI
              value: {{ include "ai-stack.postgresURI" . | quote }}
            {{- end }}
            {{- include "ai-stack.qdrantApiKeyEnv" . | nindent 12 }}
            - name: LANGGRAPH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "langgraph") }}-secret
                  key: api-key
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "langgraph") | nindent 12 }}
          startupProbe:
            httpGet:
              path: /ok
              port: http
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: graphs
              mountPath: /deps/graphs
            - name: tmp
              mountPath: /tmp
          {{- with .Values.langgraph.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.langgraph.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.langgraph.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: graphs
          {{- if .Values.langgraph.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "langgraph") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 500Mi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "langgraph") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "langgraph") | nindent 4 }}
spec:
  type: {{ .Values.langgraph.service.type }}
  ports:
    - port: {{ .Values.langgraph.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "langgraph") | nindent 4 }}
{{- if .Values.langgraph.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "langgraph") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "langgraph") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.langgraph.persistence.accessMode }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.langgraph.persistence.size }}
{{- end }}
{{- include "ai-stack.ingress" (dict "root" . "component" "langgraph" "ingress" .Values.langgraph.ingress) }}
{{- include "ai-stack.httpRoute" (dict "root" . "component" "langgraph" "httpRoute" .Values.langgraph.httpRoute "servicePort" .Values.langgraph.service.port) }}
{{- end }}
