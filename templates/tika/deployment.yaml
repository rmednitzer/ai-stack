{{- if .Values.tika.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "tika") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "tika") | nindent 4 }}
    {{- include "ai-stack.governanceLabels" "tika" | nindent 4 }}
  annotations:
    {{- include "ai-stack.governanceControlRefs" "tika" | nindent 4 }}
spec:
  {{- if not (include "ai-stack.autoscalingEnabled" .Values.tika) }}
  replicas: {{ .Values.tika.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "tika") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "tika") | nindent 8 }}
        {{- include "ai-stack.governanceLabels" "tika" | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        assurance.platform/security-exception: "tika-requires-root"
        assurance.platform/security-exception-reason: "Upstream Tika image runs as root for Java process management"
        {{- include "ai-stack.governanceControlRefs" "tika" | nindent 8 }}
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "tika") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: false
        fsGroup: 35002
        seccompProfile:
          type: RuntimeDefault
      {{- include "ai-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "tika" "replicaCount" .Values.tika.replicaCount "autoscaling" (include "ai-stack.autoscalingEnabled" .Values.tika)) | nindent 6 }}
      containers:
        - name: tika
          image: "{{ .Values.tika.image.repository }}{{- if .Values.tika.image.digest }}@{{ .Values.tika.image.digest }}{{- else }}:{{ .Values.tika.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 9998
              protocol: TCP
          env:
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "tika") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /tika
              port: http
            failureThreshold: 20
            periodSeconds: 5
          {{- with .Values.tika.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tika.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tika.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "tika") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "tika") | nindent 4 }}
spec:
  type: {{ .Values.tika.service.type }}
  ports:
    - port: {{ .Values.tika.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "tika") | nindent 4 }}
{{- end }}
