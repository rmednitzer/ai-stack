{{- if and .Values.postgres.enabled (eq .Values.postgres.mode "cnpg") }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "postgres") | nindent 4 }}
    {{- include "ai-stack.governanceLabels" "postgres" | nindent 4 }}
  annotations:
    {{- include "ai-stack.governanceControlRefs" "postgres" | nindent 4 }}
spec:
  instances: {{ .Values.postgres.cnpg.instances }}
  imageName: {{ .Values.postgres.cnpg.imageName | quote }}

  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.user }}

  postgresql:
    {{- with .Values.postgres.cnpg.postgresql.parameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if ne .Values.postgres.tls.mode "disable" }}
    pg_hba:
      - hostssl all all all cert
      - hostssl all all all scram-sha-256
    {{- end }}

  {{- if ne .Values.postgres.tls.mode "disable" }}
  enableSuperuserAccess: false
  {{- end }}

  storage:
    size: {{ .Values.postgres.cnpg.storage.size }}
    {{- if .Values.postgres.cnpg.storage.storageClass }}
    storageClassName: {{ .Values.postgres.cnpg.storage.storageClass | quote }}
    {{- else if .Values.global.storageClass }}
    storageClassName: {{ .Values.global.storageClass | quote }}
    {{- end }}

  {{- with .Values.postgres.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if .Values.postgres.cnpg.backup.enabled }}
  backup:
    barmanObjectStore:
      {{- toYaml .Values.postgres.cnpg.backup.barmanObjectStore | nindent 6 }}
    retentionPolicy: {{ .Values.postgres.cnpg.backup.retentionPolicy | quote }}
  {{- end }}

  {{- if .Values.postgres.cnpg.monitoring.enabled }}
  monitoring:
    enablePodMonitor: true
  {{- end }}

  # Maintenance window — prefer weekends, unsupervised upgrades
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
{{- if and .Values.postgres.cnpg.backup.enabled .Values.postgres.cnpg.backup.schedule }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-postgres-backup
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "postgres") | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.cnpg.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ .Release.Name }}-postgres
{{- end }}
{{- end }}
