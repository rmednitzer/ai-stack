{{- if and .Values.postgres.enabled (eq .Values.postgres.mode "cnpg") .Values.postgres.cnpg.pooler.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Release.Name }}-postgres-pooler-{{ .Values.postgres.cnpg.pooler.type }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "postgres") | nindent 4 }}
    assurance.platform/tier: "T2"
    assurance.platform/boundary: "storage"
  annotations:
    assurance.platform/control-refs: "CTL-002,POL-001"
spec:
  cluster:
    name: {{ .Release.Name }}-postgres
  instances: {{ .Values.postgres.cnpg.pooler.instances }}
  type: {{ .Values.postgres.cnpg.pooler.type }}
  pgbouncer:
    poolMode: {{ .Values.postgres.cnpg.pooler.pgbouncer.poolMode }}
    parameters:
      default_pool_size: {{ .Values.postgres.cnpg.pooler.pgbouncer.defaultPoolSize | quote }}
      max_client_conn: {{ .Values.postgres.cnpg.pooler.pgbouncer.maxClientConn | quote }}

  {{- if .Values.postgres.cnpg.monitoring.enabled }}
  monitoring:
    enablePodMonitor: true
  {{- end }}
{{- end }}
