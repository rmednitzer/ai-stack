{{- if .Values.openwebui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "openwebui") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "openwebui") | nindent 4 }}
    assurance.platform/tier: "T1"
    assurance.platform/boundary: "decision"
  annotations:
    {{- include "ai-stack.syncWave" "app" | nindent 4 }}
spec:
  {{- if not (include "ai-stack.autoscalingEnabled" .Values.openwebui) }}
  replicas: {{ .Values.openwebui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "openwebui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "openwebui") | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "openwebui") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      {{- include "ai-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "openwebui" "replicaCount" .Values.openwebui.replicaCount "autoscaling" (include "ai-stack.autoscalingEnabled" .Values.openwebui)) | nindent 6 }}
      containers:
        - name: openwebui
          image: "{{ .Values.openwebui.image.repository }}{{- if .Values.openwebui.image.digest }}@{{ .Values.openwebui.image.digest }}{{- else }}:{{ .Values.openwebui.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "ai-stack.restrictedSecurityContext" (dict "readOnlyRootFilesystem" false "runAsUser" 1000) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $key, $value := .Values.openwebui.env }}
            {{- if and (eq $key "OPENAI_API_BASE_URLS") (or $.Values.externalAPIs.enabled (and $.Values.pydanticai.enabled $.Values.pydanticai.exposeToOpenWebUI)) }}
            {{- /* Skip static OPENAI_API_BASE_URLS when external APIs or Pydantic AI are wired in — overridden below */ -}}
            {{- else }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- end }}
            {{- include "ai-stack.qdrantApiKeyEnv" . | nindent 12 }}
            {{- /* --- High-availability state: WEBUI_SECRET_KEY + shared Postgres + Valkey websocket manager --- */ -}}
            {{- include "ai-stack.webuiHaEnv" . | nindent 12 }}
            {{- /* --- OpenAI-compatible provider wiring (external APIs and/or the internal Pydantic AI agent) --- */ -}}
            {{- if or (and .Values.externalAPIs.enabled .Values.externalAPIs.providers) (and .Values.pydanticai.enabled .Values.pydanticai.exposeToOpenWebUI) }}
            {{- if and .Values.externalAPIs.enabled .Values.externalAPIs.providers }}
            {{- /* Inject per-provider API key env vars from Secrets (used via variable substitution) */ -}}
            {{- range $i, $provider := .Values.externalAPIs.providers }}
            - name: _EXTAPI_KEY_{{ $i }}
              valueFrom:
                secretKeyRef:
                  {{- if and $provider.existingSecret $provider.existingSecret.name }}
                  name: {{ $provider.existingSecret.name | quote }}
                  key: {{ $provider.existingSecret.key | default "api-key" | quote }}
                  {{- else }}
                  name: {{ include "ai-stack.extapiSecretName" (dict "Release" $.Release "Chart" $.Chart "provider" $provider) }}
                  key: api-key
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- if and .Values.pydanticai.enabled .Values.pydanticai.exposeToOpenWebUI }}
            {{- /* Inject the Pydantic AI agent's API key (referenced via variable substitution in OPENAI_API_KEYS) */}}
            - name: _PYDANTICAI_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-secret" (include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "pydanticai")) }}
                  key: api-key
            {{- end }}
            {{- /* Override OPENAI_API_BASE_URLS with the combined internal + external URLs */}}
            - name: OPENAI_API_BASE_URLS
              value: {{ include "ai-stack.openaiBaseUrls" . | quote }}
            {{- /* Set OPENAI_API_KEYS with placeholder keys for internal + secret refs for external */}}
            - name: OPENAI_API_KEYS
              value: {{ include "ai-stack.openaiApiKeys" . | quote }}
            {{- end }}
            {{- include "ai-stack.autheliaOauthEnv" . | nindent 12 }}
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "openwebui") | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: {{ .Values.openwebui.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
          {{- with .Values.openwebui.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.openwebui.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.openwebui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.openwebui.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "openwebui") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 500Mi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "openwebui") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "openwebui") | nindent 4 }}
spec:
  type: {{ .Values.openwebui.service.type }}
  ports:
    - port: {{ .Values.openwebui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "openwebui") | nindent 4 }}
{{- if .Values.openwebui.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "openwebui") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "openwebui") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.openwebui.persistence.accessMode }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.openwebui.persistence.size }}
{{- end }}
{{- include "ai-stack.ingress" (dict "root" . "component" "openwebui" "ingress" .Values.openwebui.ingress) }}
{{- include "ai-stack.httpRoute" (dict "root" . "component" "openwebui" "httpRoute" .Values.openwebui.httpRoute "servicePort" .Values.openwebui.service.port) }}
{{- end }}
