{{- if .Values.mcpo.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "mcpo") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "mcpo") | nindent 4 }}
    {{- include "ai-stack.governanceLabels" "mcpo" | nindent 4 }}
  annotations:
    {{- include "ai-stack.governanceControlRefs" "mcpo" | nindent 4 }}
    {{- include "ai-stack.syncWave" "app" | nindent 4 }}
spec:
  replicas: {{ .Values.mcpo.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "mcpo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "mcpo") | nindent 8 }}
        {{- include "ai-stack.governanceLabels" "mcpo" | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        checksum/config: {{ .Values.mcpo.config | toJson | sha256sum }}
        {{- include "ai-stack.governanceControlRefs" "mcpo" | nindent 8 }}
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "mcpo") }}
      automountServiceAccountToken: false
      {{- with .Values.mcpo.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "ai-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "mcpo" "replicaCount" .Values.mcpo.replicaCount) | nindent 6 }}
      containers:
        - name: mcpo
          image: "{{ .Values.mcpo.image.repository }}:{{ .Values.mcpo.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "ai-stack.restrictedSecurityContext" (dict "readOnlyRootFilesystem" false "runAsUser" 1000) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.mcpo.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            - name: MCPO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "mcpo") }}-secret
                  key: api-key
            {{- include "ai-stack.otelEnv" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "mcpo") | nindent 12 }}
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--config"
            - "/config/config.json"
          startupProbe:
            # MCPO is a FastAPI gateway with no GET / route (returns 404); probe
            # the framework-generated /openapi.json (200, present even with an
            # empty mcpServers set) so the startupProbe can succeed and let the
            # liveness/readiness probes activate. Probing / here would 404 for all
            # failureThreshold attempts → CrashLoopBackOff, pod never Ready. This
            # mirrors the liveness/readiness path fixed in the F-1 audit change.
            httpGet:
              path: /openapi.json
              port: http
            failureThreshold: 20
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.mcpo.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcpo.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcpo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "mcpo") }}-config
        - name: tmp
          emptyDir:
            sizeLimit: 500Mi
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "mcpo") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "mcpo") | nindent 4 }}
spec:
  type: {{ .Values.mcpo.service.type }}
  ports:
    - port: {{ .Values.mcpo.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "mcpo") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "mcpo") }}-config
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "mcpo") | nindent 4 }}
data:
  config.json: |
    {{- .Values.mcpo.config | toPrettyJson | nindent 4 }}
{{- end }}
