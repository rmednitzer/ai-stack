{{/*
Per-component ServiceAccounts with automountServiceAccountToken: false.
This prevents automatic token mounting into pods — explicit opt-in only.
Aligns with platform-assurance security-assessment.md TB2 (east-west spoofing)
and POL-03 least-privilege access control.
*/}}

{{/* Connection test ServiceAccount — always created for helm test */}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "connection-test") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: false

{{- $components := list "openwebui" "ollama" "qdrant" "tika" "searxng" "pipelines" "valkey" "ingestion-worker" "workbench" "open-terminal" "mcpo" "langgraph" "postgres" "otel-collector" "authelia" }}
{{- range $component := $components }}
{{- $enabled := true }}
{{- if eq $component "otel-collector" }}
  {{- $enabled = $.Values.global.otel.enabled }}
{{- else if eq $component "ingestion-worker" }}
  {{- $enabled = $.Values.ingestionWorker.enabled }}
{{- else if eq $component "open-terminal" }}
  {{- $enabled = $.Values.openTerminal.enabled }}
{{- else if eq $component "mcpo" }}
  {{- $enabled = $.Values.mcpo.enabled }}
{{- else if eq $component "langgraph" }}
  {{- $enabled = $.Values.langgraph.enabled }}
{{- else if eq $component "postgres" }}
  {{- $enabled = and $.Values.postgres.enabled (eq $.Values.postgres.mode "standalone") }}
{{- else if eq $component "authelia" }}
  {{- $enabled = $.Values.authelia.enabled }}
{{- else }}
  {{- $enabled = (index $.Values $component).enabled }}
{{- end }}
{{- if $enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" $.Release "Chart" $.Chart "component" $component) }}
  labels:
    {{- include "ai-stack.labels" $ | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" $.Release "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
