{{/*
Per-component ServiceAccounts with automountServiceAccountToken: false.
This prevents automatic token mounting into pods — explicit opt-in only.
Aligns with platform-assurance security-assessment.md TB2 (east-west spoofing)
and POL-03 least-privilege access control.
*/}}

{{- $components := list "openwebui" "ollama" "qdrant" "tika" "searxng" "jupyter" "pipelines" "valkey" "workbench" "open-terminal" "otel-collector" }}
{{- range $component := $components }}
{{- $enabled := true }}
{{- if eq $component "otel-collector" }}
  {{- $enabled = $.Values.global.otel.enabled }}
{{- else if eq $component "open-terminal" }}
  {{- $enabled = $.Values.openTerminal.enabled }}
{{- else }}
  {{- $enabled = (index $.Values $component).enabled }}
{{- end }}
{{- if $enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" $.Release "Chart" $.Chart "component" $component) }}
  labels:
    {{- include "ai-stack.labels" $ | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" $.Release "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
