{{/*
Per-component ServiceAccounts with automountServiceAccountToken: false.
Implements POL-001 least-privilege access control.
*/}}

{{/* Connection test ServiceAccount — always created for helm test */}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "connection-test") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: false

{{- $components := list "openwebui" "ollama" "qdrant" "tika" "searxng" "valkey" "ingestion-worker" "open-terminal" "mcpo" "langgraph" "pydanticai" "postgres" "otel-collector" "authelia" }}
{{- range $component := $components }}
{{- if include "ai-stack.componentEnabled" (dict "Values" $.Values "component" $component) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" $.Release "Chart" $.Chart "component" $component) }}
  labels:
    {{- include "ai-stack.labels" $ | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" $.Release "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
