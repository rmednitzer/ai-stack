{{/*
Veeam K10 (Kasten) backup integration.
Instead of custom CronJobs, this chart annotates PVCs for K10 auto-discovery
and creates a K10 Policy CR when global.backup.enabled=true.
K10 handles snapshot creation, retention, export, and restore orchestration.

Prerequisites:
  - Veeam K10 installed in the cluster (namespace: kasten-io)
  - CSI driver with snapshot support (vSphere CSI on Tanzu)
  - VolumeSnapshotClass configured
*/}}

{{- if .Values.global.backup.enabled }}
---
apiVersion: config.kio.kasten.io/v1alpha1
kind: Policy
metadata:
  name: {{ include "ai-stack.fullname" . }}-backup
  namespace: kasten-io
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  comment: "Automated backup policy for ai-stack stateful components"
  frequency: {{ .Values.global.backup.frequency | default "@daily" | quote }}
  retention:
    daily: 7
    weekly: 4
    monthly: 12
  selector:
    matchExpressions:
      - key: k10.kasten.io/appNamespace
        operator: In
        values:
          - {{ .Release.Namespace }}
  actions:
    - action: backup
      backupParameters:
        filters:
          includeResources:
            - resource: persistentvolumeclaims
            - resource: secrets
            - resource: configmaps
{{- end }}
