{{/*
PodDisruptionBudgets — ensures availability during voluntary disruptions.
  - Scalable T1 components: minAvailable=1 when replicas > 1 or HPA active
  - Stateful/GPU components: maxUnavailable=1 always
  - T0 authentication: maxUnavailable=1 always

unhealthyPodEvictionPolicy: AlwaysAllow (policy/v1, GA in K8s 1.27) lets the
node drain / eviction API remove pods that are not Ready even while the budget
is unmet, avoiding the classic deadlock where an unhealthy pod cannot be
evicted because the PDB is already breached. Healthy pods remain protected.
*/}}

{{/* Scalable components — PDB only when multi-replica or HPA */}}
{{- $scalable := dict "openwebui" .Values.openwebui "tika" .Values.tika "langgraph" .Values.langgraph "ingestion-worker" .Values.ingestionWorker "pydanticai" .Values.pydanticai }}
{{- range $component, $spec := $scalable }}
{{- $multiReplica := gt (int $spec.replicaCount) 1 }}
{{- $hpaActive := and (hasKey $spec "autoscaling") $spec.autoscaling.enabled }}
{{- if and $spec.enabled (or $multiReplica $hpaActive) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" $.Release "Chart" $.Chart "component" $component) }}
  labels:
    {{- include "ai-stack.labels" $ | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" $.Release "component" $component) | nindent 4 }}
  annotations:
    {{- include "ai-stack.syncWave" "policy" | nindent 4 }}
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" $.Release "component" $component) | nindent 6 }}
{{- end }}
{{- end }}

{{/* Stateful/GPU/critical components — always PDB with maxUnavailable=1 */}}
{{- $protected := dict "ollama" .Values.ollama.enabled "qdrant" .Values.qdrant.enabled "authelia" .Values.authelia.enabled "searxng" .Values.searxng.enabled "valkey" .Values.valkey.enabled }}
{{- range $component, $enabled := $protected }}
{{- if $enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" $.Release "Chart" $.Chart "component" $component) }}
  labels:
    {{- include "ai-stack.labels" $ | nindent 4 }}
  annotations:
    {{- include "ai-stack.syncWave" "policy" | nindent 4 }}
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" $.Release "component" $component) | nindent 6 }}
{{- end }}
{{- end }}

{{/* PostgreSQL standalone — maxUnavailable=1 (CNPG manages its own PDBs) */}}
{{- if and .Values.postgres.enabled (eq .Values.postgres.mode "standalone") }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "postgres") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    {{- include "ai-stack.syncWave" "policy" | nindent 4 }}
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "postgres") | nindent 6 }}
{{- end }}
