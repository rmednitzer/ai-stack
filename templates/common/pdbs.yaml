{{/*
Ingestion Worker: scalable worker — PDB when replicas > 1 or HPA active
*/}}
{{- if .Values.ingestionWorker.enabled }}
{{- $multiReplica := gt (int .Values.ingestionWorker.replicaCount) 1 }}
{{- $hpaActive := and (hasKey .Values.ingestionWorker "autoscaling") .Values.ingestionWorker.autoscaling.enabled }}
{{- if or $multiReplica $hpaActive }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "ingestion-worker") }}
