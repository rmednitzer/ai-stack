{{/*
Secrets for credentials that must not be in values.yaml plaintext.
Generate random values on first install; user overrides via values or
external secret management (ESO / Vault).
*/}}

{{- if .Values.searxng.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "searxng") }}-secret
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.searxng.secretKey }}
  secret-key: {{ .Values.searxng.secretKey | b64enc | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}

