{{- if and .Values.externalAPIs.enabled .Values.externalAPIs.providers }}
{{- range $provider := .Values.externalAPIs.providers }}
{{- if not (and $provider.existingSecret $provider.existingSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-stack.extapiSecretName" (dict "Release" $.Release "Chart" $.Chart "provider" $provider) }}
  labels:
    {{- include "ai-stack.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-key: {{ required (printf "externalAPIs provider %q requires either .apiKey or .existingSecret.name" $provider.name) $provider.apiKey | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.authelia.enabled }}
{{- $name := printf "%s-secret" (include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  oidc-client-secret: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "oidc-client-secret" "override" .Values.authelia.oidc.clientSecret "length" 64) | quote }}
  jwt-secret: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "jwt-secret" "override" "" "length" 64) | quote }}
  session-secret: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "session-secret" "override" "" "length" 64) | quote }}
  storage-encryption-key: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "storage-encryption-key" "override" "" "length" 64) | quote }}
{{- end }}

