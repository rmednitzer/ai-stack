{{/*
Secrets for credentials that must not be in values.yaml plaintext.

Values are resolved via "ai-stack.persistentSecret": an explicit override
wins; otherwise the value already stored in the live Secret is reused so
that generated credentials remain STABLE across `helm upgrade`; only on
first install (or `helm template`) is a new random value generated.

Rotating these silently on every upgrade would churn auth tokens and, for
Authelia's storage-encryption-key, render the existing database
undecryptable — hence the lookup-based persistence.
*/}}

{{- if .Values.openwebui.enabled }}
{{- $name := printf "%s-secret" (include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "openwebui")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Signs sessions/JWTs. MUST stay stable across restarts and be identical on
  # every replica (otherwise users hit login loops / 401s); persisted via lookup.
  secret-key: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "secret-key" "override" .Values.openwebui.secretKey "length" 64) | quote }}
{{- end }}

