{{- if and .Values.externalAPIs.enabled .Values.externalAPIs.providers }}
{{- range $provider := .Values.externalAPIs.providers }}
{{- if not (and $provider.existingSecret $provider.existingSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-stack.extapiSecretName" (dict "Release" $.Release "Chart" $.Chart "provider" $provider) }}
  labels:
    {{- include "ai-stack.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- include "ai-stack.syncWave" "foundation" | nindent 4 }}
type: Opaque
data:
  api-key: {{ required (printf "externalAPIs provider %q requires either .apiKey or .existingSecret.name" $provider.name) $provider.apiKey | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}

{{/* Envoy AI Gateway provider upstream API keys (BackendSecurityPolicy reads data key "apiKey"). */}}
{{- if and .Values.aiGateway.enabled .Values.aiGateway.providers }}
{{- range $provider := .Values.aiGateway.providers }}
{{- if and $provider.apiKey (not (and $provider.existingSecret $provider.existingSecret.name)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-stack.aiGatewaySecretName" (dict "Release" $.Release "provider" $provider) }}
  labels:
    {{- include "ai-stack.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- include "ai-stack.syncWave" "foundation" | nindent 4 }}
type: Opaque
data:
  apiKey: {{ $provider.apiKey | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}

{{/* Valkey AUTH (ADR-008, opt-in): one generated password, exposed twice —
as `password` for client URLs / CLI auth env, and inside `valkey.conf`
(requirepass) which the server reads from a Secret mount so the password
never appears in container args or process listings. Both are derived from
the same persistentSecret resolution, so they cannot diverge. */}}
{{- if include "ai-stack.valkeyAuthEnabled" . }}
{{- $name := printf "%s-secret" (include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey")) }}
{{- $pw := include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "password" "override" .Values.valkey.auth.password "length" 48) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- include "ai-stack.syncWave" "foundation" | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | quote }}
  valkey.conf: {{ printf "requirepass %s\n" ($pw | b64dec) | b64enc | quote }}
{{- end }}

{{- if .Values.authelia.enabled }}
{{- $name := printf "%s-secret" (include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "authelia")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- include "ai-stack.syncWave" "foundation" | nindent 4 }}
type: Opaque
data:
  oidc-client-secret: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "oidc-client-secret" "override" .Values.authelia.oidc.clientSecret "length" 64) | quote }}
  jwt-secret: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "jwt-secret" "override" "" "length" 64) | quote }}
  session-secret: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "session-secret" "override" "" "length" 64) | quote }}
  storage-encryption-key: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "storage-encryption-key" "override" "" "length" 64) | quote }}
{{- end }}

