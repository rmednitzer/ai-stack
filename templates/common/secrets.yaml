{{/* Standalone mode: chart-managed secret. CNPG manages its own; external uses existingSecret. */}}
{{- if and .Values.postgres.enabled (eq .Values.postgres.mode "standalone") }}
{{- $name := include "ai-stack.postgresSecretName" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ include "ai-stack.persistentSecret" (dict "ctx" . "name" $name "key" "password" "override" .Values.postgres.password "length" 48) | quote }}
{{- end }}

