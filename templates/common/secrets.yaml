  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.authelia.oidc.clientSecret }}
  oidc-client-secret: {{ .Values.authelia.oidc.clientSecret | b64enc | quote }}
  {{- else }}
  oidc-client-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  session-secret: {{ randAlphaNum 64 | b64enc | quote }}
  storage-encryption-key: {{ randAlphaNum 64 | b64enc | quote }}
{{- end }}

