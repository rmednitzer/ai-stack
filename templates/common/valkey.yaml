{{- if .Values.valkey.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "valkey") | nindent 4 }}
    {{- include "ai-stack.governanceLabels" "valkey" | nindent 4 }}
  annotations:
    {{- include "ai-stack.governanceControlRefs" "valkey" | nindent 4 }}
spec:
  replicas: {{ .Values.valkey.replicaCount }}
  {{- if .Values.valkey.persistence.enabled }}
  strategy:
    type: Recreate  # RWO PVC cannot attach to two pods during a rollout
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "valkey") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "valkey") | nindent 8 }}
        {{- include "ai-stack.governanceLabels" "valkey" | nindent 8 }}
        app.kubernetes.io/part-of: ai-stack
      annotations:
        {{- include "ai-stack.governanceControlRefs" "valkey" | nindent 8 }}
        {{- include "ai-stack.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}
      automountServiceAccountToken: false
      {{- include "ai-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "ai-stack.dnsConfig" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          {{- if include "ai-stack.valkeyAuthEnabled" . }}
          # AUTH (ADR-008): requirepass is read from the Secret-mounted config
          # file — never passed as a process argument (visible in `ps`/audit
          # trails). The *CLI_AUTH env keeps the values-defined valkey-cli
          # probes working unchanged.
          args:
            - valkey-server
            - /etc/valkey/valkey.conf
          env:
            {{- include "ai-stack.valkeyCliAuthEnv" . | nindent 12 }}
          {{- end }}
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: {{ .Values.valkey.persistence.mountPath | default "/data" }}
            - name: tmp
              mountPath: /tmp
            {{- if include "ai-stack.valkeyAuthEnabled" . }}
            - name: auth-config
              mountPath: /etc/valkey
              readOnly: true
            {{- end }}
          startupProbe:
            exec:
              command: ["valkey-cli", "ping"]
            failureThreshold: 10
            periodSeconds: 3
          {{- with .Values.valkey.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.valkey.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.valkey.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.valkey.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
        {{- if include "ai-stack.valkeyAuthEnabled" . }}
        - name: auth-config
          secret:
            secretName: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}-secret
            items:
              - key: valkey.conf
                path: valkey.conf
        {{- end }}
      {{- include "ai-stack.nodeScheduling" . | nindent 6 }}
{{- if .Values.valkey.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "valkey") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.valkey.persistence.accessMode | default "ReadWriteOnce" }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.valkey.persistence.size | default "8Gi" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stack.componentName" (dict "Release" .Release "Chart" .Chart "component" "valkey") }}
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "valkey") | nindent 4 }}
spec:
  type: {{ .Values.valkey.service.type }}
  ports:
    - port: {{ .Values.valkey.service.port }}
      targetPort: valkey
      name: valkey
  selector:
    {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "valkey") | nindent 4 }}
{{- end }}
