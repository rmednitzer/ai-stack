# =============================================================================
# Workbench — widest egress in stack; full access to all AI services + internet
# =============================================================================
{{- if .Values.workbench.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-workbench
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "workbench") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 8888
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8888
  egress:
    # Ollama (inference + embeddings)
    {{- if .Values.ollama.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
    {{- end }}
    # Qdrant (vector operations)
    {{- if .Values.qdrant.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
    {{- end }}
    # Pipelines
    {{- if .Values.pipelines.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipelines
      ports:
        - protocol: TCP
          port: 9099
    {{- end }}
    # Tika (document extraction from notebooks)
    {{- if .Values.tika.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tika
      ports:
        - protocol: TCP
          port: 9998
    {{- end }}
    # SearXNG (web search from notebooks)
    {{- if .Values.searxng.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: searxng
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    # Internet (pip install, git clone, HuggingFace Hub, dataset downloads)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 22   # git+ssh
{{- end }}

# =============================================================================
# Open Terminal — sandboxed execution; accepts from Open WebUI, needs internet
# =============================================================================
{{- if .Values.openTerminal.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-open-terminal
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "open-terminal") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openwebui
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Internet (pip install, apt, git clone, etc.)
    - ports:
        - protocol: TCP
          port: 443
