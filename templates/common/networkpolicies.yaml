kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-workbench
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "workbench") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 8888
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8888
  egress:
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.ollama.enabled "name" "ollama" "port" 11434) | nindent 4 }}
    {{- if .Values.qdrant.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
    {{- end }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.pipelines.enabled "name" "pipelines" "port" 9099) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.tika.enabled "name" "tika" "port" 9998) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.searxng.enabled "name" "searxng" "port" 8080) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.langgraph.enabled "name" "langgraph" "port" 8000) | nindent 4 }}
    # Internet (pip install, git clone, HuggingFace Hub, dataset downloads)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
