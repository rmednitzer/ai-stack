# =============================================================================
# LangGraph — agentic runtime; needs PostgreSQL, Ollama, Qdrant, and internet
# =============================================================================
{{- if .Values.langgraph.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-langgraph
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "langgraph") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept from Open WebUI and Workbench
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openwebui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: workbench
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipelines
      ports:
        - protocol: TCP
          port: 8000
    # Accept from ingress controller (if ingress enabled)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # PostgreSQL (checkpoint persistence)
    {{- if .Values.postgres.enabled }}
    {{- if eq .Values.postgres.mode "external" }}
    # External PostgreSQL — egress to user-specified host
    - ports:
        - protocol: TCP
          port: {{ .Values.postgres.external.port | default 5432 }}
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              {{- if eq .Values.postgres.mode "cnpg" }}
              cnpg.io/cluster: {{ .Release.Name }}-postgres
              {{- else }}
              app.kubernetes.io/name: postgres
              {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    # Ollama (LLM inference)
    {{- if .Values.ollama.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
    {{- end }}
    # Qdrant (vector retrieval)
    {{- if .Values.qdrant.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
    {{- end }}
    # Tika (document extraction)
    {{- if .Values.tika.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tika
      ports:
        - protocol: TCP
          port: 9998
    {{- end }}
    # SearXNG (web search tools)
    {{- if .Values.searxng.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: searxng
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    # Pipelines
    {{- if .Values.pipelines.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipelines
      ports:
        - protocol: TCP
          port: 9099
    {{- end }}
    # Internet (agentic tool calls, external APIs)
    - ports:
        - protocol: TCP
          port: 443
{{- end }}

