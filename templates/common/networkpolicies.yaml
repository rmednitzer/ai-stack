{{- if .Values.global.networkPolicy.enabled }}
# =============================================================================
# Default deny + DNS — foundation per security-assessment.md TB2
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-default-deny
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ai-stack
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-allow-dns
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ai-stack
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# =============================================================================
# Connection test pod — allows the helm test pod to reach all enabled services
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-connection-test
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: connection-test
  policyTypes:
    - Egress
  egress:
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.openwebui.enabled "name" "openwebui" "port" .Values.openwebui.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.ollama.enabled "name" "ollama" "port" .Values.ollama.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.qdrant.enabled "name" "qdrant" "port" .Values.qdrant.service.httpPort) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.tika.enabled "name" "tika" "port" .Values.tika.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.searxng.enabled "name" "searxng" "port" .Values.searxng.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.pipelines.enabled "name" "pipelines" "port" .Values.pipelines.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.valkey.enabled "name" "valkey" "port" .Values.valkey.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.workbench.enabled "name" "workbench" "port" .Values.workbench.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.openTerminal.enabled "name" "open-terminal" "port" .Values.openTerminal.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.mcpo.enabled "name" "mcpo" "port" .Values.mcpo.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.langgraph.enabled "name" "langgraph" "port" .Values.langgraph.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" (and .Values.postgres.enabled (eq .Values.postgres.mode "standalone")) "name" "postgres" "port" .Values.postgres.service.port) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.authelia.enabled "name" "authelia" "port" .Values.authelia.service.port) | nindent 4 }}
    {{- if .Values.global.otel.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 8888
    {{- end }}

# =============================================================================
# OTel Collector — accepts OTLP from all stack pods; exports to platform
# =============================================================================
{{- if .Values.global.otel.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-otel-collector
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "otel-collector") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept OTLP from any ai-stack pod
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ai-stack
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Prometheus scrape from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8889
    # helm test connection check
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: connection-test
      ports:
        - protocol: TCP
          port: 8888
  egress:
    # Forward to platform OTel Collector / Prometheus / Loki
    - ports:
        - protocol: TCP
          port: 4317  # OTLP gRPC
        - protocol: TCP
          port: 4318  # OTLP HTTP
        - protocol: TCP
          port: 3100  # Loki
        - protocol: TCP
          port: 9090  # Prometheus remote write
    # Scrape ai-stack component metrics
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ai-stack
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 11434
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 9998
        - protocol: TCP
          port: 9099
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
{{- end }}

# =============================================================================
# All stack pods — egress to OTel Collector (OTLP)
# =============================================================================
{{- if .Values.global.otel.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-allow-otel-egress
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ai-stack
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
{{- end }}

