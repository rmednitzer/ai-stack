# =============================================================================
# LangGraph — agentic runtime; needs PostgreSQL, Ollama, Qdrant, and internet
# =============================================================================
{{- if .Values.langgraph.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-langgraph
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "langgraph") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept from Open WebUI and Workbench
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openwebui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: workbench
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipelines
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: connection-test
      ports:
        - protocol: TCP
          port: 8000
    # Accept from ingress controller (if ingress enabled)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    {{- if .Values.postgres.enabled }}
    {{- if eq .Values.postgres.mode "external" }}
    - ports:
        - protocol: TCP
          port: {{ .Values.postgres.external.port | default 5432 }}
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              {{- if eq .Values.postgres.mode "cnpg" }}
              cnpg.io/cluster: {{ .Release.Name }}-postgres
              {{- else }}
              app.kubernetes.io/name: postgres
              {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.ollama.enabled "name" "ollama" "port" 11434) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.qdrant.enabled "name" "qdrant" "port" 6333) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.tika.enabled "name" "tika" "port" 9998) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.searxng.enabled "name" "searxng" "port" 8080) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.pipelines.enabled "name" "pipelines" "port" 9099) | nindent 4 }}
    - ports:
        - protocol: TCP
          port: 443
{{- end }}

# =============================================================================
# PostgreSQL — accepts from LangGraph only (standalone mode)
# CNPG mode: operator manages its own NetworkPolicies.
# External mode: no in-cluster PostgreSQL pods to protect.
# =============================================================================
{{- if and .Values.postgres.enabled (eq .Values.postgres.mode "standalone") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-postgres
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.langgraph.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: langgraph
        {{- end }}
        {{- if .Values.ingestionWorker.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingestion-worker
        {{- end }}
        {{- if and .Values.authelia.enabled (eq .Values.authelia.storage "postgres") }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authelia
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: connection-test
      ports:
        - protocol: TCP
          port: 5432
{{- end }}

# =============================================================================
# Valkey
# =============================================================================
{{- if .Values.valkey.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
