              app.kubernetes.io/name: openwebui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: searxng
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipelines
        {{- if $.Values.ingestionWorker.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingestion-worker
        {{- end }}
        {{- if $.Values.authelia.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authelia
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: connection-test
      ports:
        - protocol: TCP
          port: 6379
{{- end }}

# =============================================================================
# Authelia — OIDC provider; accepts from Open WebUI + ingress, needs Valkey
# =============================================================================
{{- if .Values.authelia.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-authelia
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "authelia") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Open WebUI backend-channel (token exchange, userinfo)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openwebui
      ports:
        - protocol: TCP
          port: 9091
    # Browser redirects via ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 9091
    # helm test connection check
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: connection-test
      ports:
        - protocol: TCP
          port: 9091
  egress:
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.valkey.enabled "name" "valkey" "port" 6379) | nindent 4 }}
    # PostgreSQL (if storage=postgres)
    {{- if and .Values.postgres.enabled (eq .Values.authelia.storage "postgres") }}
    {{- if eq .Values.postgres.mode "external" }}
    - ports:
        - protocol: TCP
          port: {{ .Values.postgres.external.port | default 5432 }}
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              {{- if eq .Values.postgres.mode "cnpg" }}
              cnpg.io/cluster: {{ .Release.Name }}-postgres
              {{- else }}
              app.kubernetes.io/name: postgres
              {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
{{- end }}

# =============================================================================
# Ingestion Worker — async document processing; egress to Valkey, Tika, Ollama, Qdrant
# =============================================================================
{{- if .Values.ingestionWorker.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-ingestion-worker
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "ingestion-worker") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.valkey.enabled "name" "valkey" "port" 6379) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.tika.enabled "name" "tika" "port" 9998) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.ollama.enabled "name" "ollama" "port" 11434) | nindent 4 }}
    {{- include "ai-stack.netpolEgress" (dict "enabled" .Values.qdrant.enabled "name" "qdrant" "port" 6333) | nindent 4 }}
    {{- if .Values.postgres.enabled }}
    {{- if eq .Values.postgres.mode "external" }}
    - ports:
        - protocol: TCP
          port: {{ .Values.postgres.external.port | default 5432 }}
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              {{- if eq .Values.postgres.mode "cnpg" }}
              cnpg.io/cluster: {{ .Release.Name }}-postgres
              {{- else }}
              app.kubernetes.io/name: postgres
              {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
{{- end }}

# =============================================================================
# Backup CronJob pods — egress to Qdrant and Ollama APIs
# =============================================================================
{{- if .Values.global.backup.enabled }}
{{- if .Values.qdrant.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-qdrant-backup
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
{{- end }}
{{- if .Values.ollama.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-ollama-backup
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
{{- end }}
{{- end }}
{{- end }}
