          port: 9099
    {{- end }}
    {{- if .Values.qdrant.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
    {{- end }}
    {{- if .Values.tika.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tika
      ports:
        - protocol: TCP
          port: 9998
    {{- end }}
    {{- if .Values.searxng.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: searxng
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.valkey.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.openTerminal.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-terminal
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
    {{- if .Values.mcpo.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcpo
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
    {{- if .Values.langgraph.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: langgraph
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
{{- end }}

