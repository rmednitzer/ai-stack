          port: 9998
    {{- end }}
    {{- if .Values.searxng.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: searxng
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.valkey.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.openTerminal.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-terminal
