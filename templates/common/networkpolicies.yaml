{{- if .Values.global.networkPolicy.enabled }}
# =============================================================================
# Default deny + DNS — foundation per security-assessment.md TB2
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-default-deny
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ai-stack
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-allow-dns
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ai-stack
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# =============================================================================
# OTel Collector — accepts OTLP from all stack pods; exports to platform
# =============================================================================
{{- if .Values.global.otel.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-otel-collector
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-stack.selectorLabels" (dict "Release" .Release "component" "otel-collector") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept OTLP from any ai-stack pod
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ai-stack
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Prometheus scrape from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8889
  egress:
    # Forward to platform OTel Collector / Prometheus / Loki
    - ports:
        - protocol: TCP
          port: 4317  # OTLP gRPC
        - protocol: TCP
          port: 4318  # OTLP HTTP
        - protocol: TCP
          port: 3100  # Loki
        - protocol: TCP
          port: 9090  # Prometheus remote write
    # Scrape ai-stack component metrics
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ai-stack
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 11434
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 9998
        - protocol: TCP
          port: 9099
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
{{- end }}

# =============================================================================
# All stack pods — egress to OTel Collector (OTLP)
# =============================================================================
{{- if .Values.global.otel.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-allow-otel-egress
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ai-stack
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
{{- end }}

# =============================================================================
# Open WebUI
# =============================================================================
{{- if .Values.openwebui.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-stack.fullname" . }}-openwebui
  labels:
    {{- include "ai-stack.labels" . | nindent 4 }}
spec:
  podSelector:
