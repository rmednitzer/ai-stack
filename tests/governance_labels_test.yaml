suite: governance label integrity (tier / boundary / control-refs on every workload)
# Asserts the governance-as-code contract documented in
# docs/governance/CONTROLS.md (Governance label vocabulary) and ADR-005:
# every workload carries assurance.platform/{tier,boundary,control-refs} with
# canonical values, and every workload references CTL-002 (network-boundary
# governance) and POL-001 (least-privilege identity). This is the structural
# guard that keeps the templates, the per-component docs, and the CTL/POL
# registry from drifting apart again (they did for 8 components before v2.8.0).
release:
  name: ai-stack
  namespace: ai-stack
tests:
  - it: authelia carries T0 / authentication / CTL-002,POL-001
    templates:
      - templates/authelia/deployment.yaml
    set:
      authelia.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.labels["assurance.platform/tier"]
          value: "T0"
      - equal:
          path: metadata.labels["assurance.platform/boundary"]
          value: "authentication"
      - equal:
          path: metadata.annotations["assurance.platform/control-refs"]
          value: "CTL-002,POL-001"

  - it: openwebui carries T1 / decision / CTL-002,POL-001
