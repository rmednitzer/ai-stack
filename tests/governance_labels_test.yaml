suite: governance label integrity (tier / boundary / control-refs on every workload)
# Asserts the governance-as-code contract in docs/governance/CONTROLS.md
# (Governance label vocabulary) and ADR-005: every workload carries the
# assurance.platform/{tier,boundary} labels and the control-refs annotation with
# canonical values, on BOTH the controller object AND its pod template (so a
# pod-scanning evidence pipeline sees the same metadata a controller scan does).
# Every workload references CTL-002 (network-boundary governance) and POL-001
# (least-privilege identity); the OTel Collector adds CTL-001 (observability).
#
# Scope: long-lived workloads. The `helm test` hook Pod
# (templates/tests/connection-test.yaml) is intentionally excluded — it is an
# ephemeral test hook (helm.sh/hook: test), not a governed runtime workload.
#
# This is the structural guard that keeps the templates, the per-component docs,
# and the CTL/POL registry from drifting apart (they did for 8 components before
# v2.8.0). Controller and pod-template values come from one source —
# ai-stack.governanceMap in templates/_helpers.tpl.
release:
  name: ai-stack
  namespace: ai-stack
tests:
  - it: authelia carries T0 / authentication / CTL-002,POL-001 on controller and pod
    templates:
      - templates/authelia/deployment.yaml
    set:
      authelia.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal: {path: 'metadata.labels["assurance.platform/tier"]', value: "T0"}
      - equal: {path: 'metadata.labels["assurance.platform/boundary"]', value: "authentication"}
      - equal: {path: 'metadata.annotations["assurance.platform/control-refs"]', value: "CTL-002,POL-001"}
      - equal: {path: 'spec.template.metadata.labels["assurance.platform/tier"]', value: "T0"}
      - equal: {path: 'spec.template.metadata.labels["assurance.platform/boundary"]', value: "authentication"}
      - equal: {path: 'spec.template.metadata.annotations["assurance.platform/control-refs"]', value: "CTL-002,POL-001"}

