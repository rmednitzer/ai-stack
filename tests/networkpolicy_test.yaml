suite: network policy default-deny and tool-plane isolation
templates:
  - templates/common/networkpolicies.yaml
release:
  name: ai-stack
  namespace: ai-stack
tests:
  - it: renders a default-deny policy for ingress and egress
    documentSelector:
      path: metadata.name
      value: ai-stack-default-deny
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/part-of"]
          value: ai-stack
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      - notExists:
          path: spec.ingress

  - it: restricts Open Terminal ingress to Open WebUI (least privilege)
    set:
      openTerminal.enabled: true
    documentSelector:
      path: metadata.name
      value: ai-stack-open-terminal
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: openwebui

  - it: restricts MCPO ingress to Open WebUI (least privilege)
    set:
      mcpo.enabled: true
    documentSelector:
      path: metadata.name
      value: ai-stack-mcpo
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: openwebui

  - it: scopes Open WebUI in-namespace ingress to the helm-test pod, not every pod
    documentSelector:
      path: metadata.name
      value: ai-stack-openwebui
    asserts:
      # rule 0: ingress controller namespace; rule 1: in-namespace allowlist
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: connection-test
      # the pre-2.12.0 any-pod admission must not come back
      - notContains:
          path: spec.ingress[1].from
          content:
            podSelector: {}

  - it: admits the OTel Collector scrape to Open WebUI only when telemetry is on
    set:
      global.otel.enabled: true
    documentSelector:
      path: metadata.name
      value: ai-stack-openwebui
    asserts:
      - contains:
          path: spec.ingress[1].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: otel-collector

  - it: scopes OTel Collector export egress to the observability + monitoring namespaces
    set:
      global.otel.enabled: true
    documentSelector:
      path: metadata.name
      value: ai-stack-otel-collector
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: observability
      - equal:
          path: spec.egress[0].to[1].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: monitoring

  - it: permits Ollama runtime model-pull egress on :443 by default (ADR-019)
    documentSelector:
      path: metadata.name
      value: ai-stack-ollama
    asserts:
      - equal:
          path: spec.egress[0].ports[0].port
          value: 443
  - it: closes Ollama model-pull egress when allowModelPullEgress is false (air-gapped)
    set:
      ollama.allowModelPullEgress: false
    documentSelector:
      path: metadata.name
      value: ai-stack-ollama
    asserts:
      # policyTypes still lists Egress; with no egress rules the namespace
      # default-deny isolates Ollama to DNS only (the shared allow-dns policy).
      - contains:
          path: spec.policyTypes
          content: Egress
      - notExists:
          path: spec.egress
