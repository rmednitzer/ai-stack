suite: Open WebUI wiring (current env-var names, validated against open-webui)
# Pins the env-var corrections from ADR-015: the names Open WebUI v0.9.x actually
# reads (the RAG_-prefixed web-search/chunk names and the byte upload cap and the
# old banner vars were renamed/removed upstream and were silently ignored). Also
# asserts the full-deployment overlay turns web search on and wires the Pydantic
# AI agent into Open WebUI's model picker. See docs/operations/full-deployment.md.
release:
  name: ai-stack
  namespace: ai-stack
templates:
  - templates/openwebui/deployment.yaml
tests:
  - it: uses the current web-search env vars (off by default, conservative)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_WEB_SEARCH
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_SEARCH_ENGINE
            value: "searxng"
      # The removed upstream name must not be shipped as dead config.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RAG_WEB_SEARCH_ENGINE
            value: "searxng"

  - it: uses the current chunking + upload-cap env vars
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHUNK_SIZE
            value: "1500"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHUNK_OVERLAP
            value: "150"
      # FILE_MAX_SIZE is in MEGABYTES (not the old MAX_UPLOAD_SIZE bytes).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FILE_MAX_SIZE
            value: "50"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RAG_CHUNK_SIZE
            value: "1500"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_UPLOAD_SIZE
            value: "52428800"

  - it: renders the AI Act banner via WEBUI_BANNERS (JSON), not the removed vars
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # The disclosure must actually be present in the JSON banner list.
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="WEBUI_BANNERS")].value
          pattern: "ai-act-disclosure"
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="WEBUI_BANNERS")].value
          pattern: "AI-powered assistant"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBUI_BANNER_TEXT
            value: "You are interacting with an AI-powered assistant. Responses are generated by a large language model and may not always be accurate."

  - it: the full-deployment overlay turns web search on and wires the agent in
    values:
      - ../values-full.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_WEB_SEARCH
            value: "true"
      # Pydantic AI agent appears as an OpenAI-compatible model endpoint.
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="OPENAI_API_BASE_URLS")].value
          pattern: "pydanticai:8000/v1"
      # Web-search tuning is applied in the full overlay (ADR-017).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_SEARCH_RESULT_COUNT
            value: "5"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_SEARCH_DOMAIN_FILTER_LIST
            value: "[]"

  # --- ADR-017: governed signup defaults + Open WebUI OTel activation ---
  - it: pins the governed signup defaults (pending role; signup toggle present)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_USER_ROLE
            value: "pending"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_SIGNUP
            value: "true"

  - it: leaves Open WebUI OTel off by default (telemetry is opt-in)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # Open WebUI gates OTel behind its own flag; off unless the pipeline is on.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_OTEL
            value: "false"

  - it: activates Open WebUI OTel (all three flags) when the pipeline is enabled
    set:
      global.otel.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_OTEL
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_OTEL_TRACES
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_OTEL_METRICS
            value: "true"
      # The shared SDK vars the chart injects (otelEnv) are present alongside them.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: "openwebui"
