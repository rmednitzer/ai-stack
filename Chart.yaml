apiVersion: v2
name: ai-stack
description: >-
  Comprehensive AI inference and tooling stack for EU-regulated on-premises
  and hybrid platform operations. Includes Open WebUI, Ollama, Qdrant,
  Apache Tika, SearXNG, Jupyter, Workbench, Valkey, and Open WebUI Pipelines.
  Designed for deployment into governance-as-code environments with
  PSA restricted baseline, NetworkPolicy default-deny, and OTel
  instrumentation hooks.
type: application
version: 0.1.0
appVersion: "2026.1"
home: https://github.com/rmednitzer/platform-assurance
maintainers:
  - name: Roman Mednitzer
    email: roman@mednitzer.at
keywords:
  - ai
  - llm
  - inference
  - rag
  - open-webui
  - ollama
  - qdrant
  - jupyter
  - searxng
  - tika
  - workbench
  - valkey
  - pipelines
annotations:
  # platform-assurance tier classification
  assurance.platform/tier: "T1"
  assurance.platform/boundary: "decision"
  assurance.platform/control-refs: "CTL-0009"
  # Regulatory scope markers
  assurance.platform/frameworks: "NIS2,GDPR,AI-Act"
