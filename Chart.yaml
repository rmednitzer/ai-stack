apiVersion: v2
name: ai-stack
description: >-
  EU-regulated AI inference stack: Open WebUI, Ollama, Qdrant, Tika,
  SearXNG, Valkey. Optional: LangGraph (agentic), Workbench (GPU/Jupyter),
  MCPO (MCP proxy), Open Terminal, Authelia (OIDC/SSO), async ingestion
  worker. PSA restricted, NetworkPolicy default-deny, OTel instrumented.
type: application
version: 2.0.0
appVersion: "2026.1"
home: https://github.com/rmednitzer/platform-assurance
maintainers:
