apiVersion: v2
name: ai-stack
description: >-
  Comprehensive AI inference and tooling stack for EU-regulated on-premises
  and hybrid platform operations. Includes Open WebUI, Ollama, Qdrant,
  Apache Tika, SearXNG, Valkey, and Open WebUI Pipelines.
  Includes Open Terminal for AI-agent sandboxed command execution.
  Includes MCPO for MCP-to-OpenAPI tool server proxying.
  Includes optional Authelia OIDC identity provider for SSO, MFA,
  and federated authentication (Apache 2.0 licensed).
  Optimised for VMware Tanzu v1.30.10 with Contour ingress and
  Veeam K10 backup. No GPU support.
  Designed for deployment into governance-as-code environments with
  PSA restricted baseline, NetworkPolicy default-deny, and OTel
  instrumentation hooks.
type: application
version: 1.0.0
appVersion: "2026.1"
