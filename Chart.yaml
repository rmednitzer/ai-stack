  - ollama
  - qdrant
  - searxng
  - tika
  - workbench
  - valkey
  - open-terminal
  - mcpo
  - langgraph
  - ingestion-worker
  - agentic
  - postgres
  - authelia
  - oidc
  - sso
annotations:
