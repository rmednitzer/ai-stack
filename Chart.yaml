apiVersion: v2
name: ai-stack
description: >-
  EU-regulated AI inference stack: Open WebUI, Ollama, Qdrant, Tika,
  SearXNG, Valkey. Optional: LangGraph or Pydantic AI (agentic),
  MCPO (MCP proxy), Open Terminal, Authelia (OIDC/SSO), async
  ingestion worker. PSA restricted, NetworkPolicy default-deny, OTel instrumented.
type: application
version: 2.9.0
appVersion: "2026.5"
# Requires PSA "restricted" (GA 1.25), networking.k8s.io/v1 NetworkPolicy,
# autoscaling/v2 HPA, and policy/v1 PodDisruptionBudget with
# unhealthyPodEvictionPolicy (GA 1.27). Opt-in HTTPRoutes additionally require
# a Gateway API implementation (gateway.networking.k8s.io/v1, e.g. Envoy Gateway).
kubeVersion: ">=1.27.0-0"
home: https://github.com/rmednitzer/ai-stack
maintainers:
  - name: Roman Mednitzer
    email: r.mednitzer@outlook.com
keywords:
  - ai
  - llm
  - inference
  - rag
  - open-webui
  - ollama
  - qdrant
  - searxng
  - tika

  - valkey
  - open-terminal
  - mcpo
  - langgraph
  - pydantic-ai
  - dbos
  - ingestion-worker
  - agentic
  - postgres
  - authelia
  - oidc
  - sso
  - ai-gateway
annotations:
  # Tier classification (see docs/governance/CONTROLS.md)
  assurance.platform/tier: "T1"
  assurance.platform/boundary: "decision"
  assurance.platform/control-refs: "CTL-002,POL-001"
  # Regulatory scope markers
  assurance.platform/frameworks: "NIS2,GDPR,AI-Act"
