# kube-linter configuration for ai-stack.
#
# Runs the full default check set (privileged containers, host mounts, latest
# tags, dangling services, unset CPU/memory, writable host paths, etc.) and
# excludes only the checks that conflict with this chart's *documented*
# security architecture. Everything else is blocking in CI (lint.yaml).
checks:
  exclude:
    # The chart sets readOnlyRootFilesystem=true wherever the upstream image
    # supports it (qdrant, valkey, otel-collector, ingestion-worker, pydanticai).
    # The remaining images (Open WebUI, Ollama, Tika, SearXNG, Postgres,
    # Authelia, …) require a writable rootfs at runtime; each instead mounts an
    # emptyDir at /tmp and drops all capabilities (SearXNG alone re-adds
    # SETUID/SETGID for its upstream startup privilege-drop). Tracking this
    # per-container is documented in README "Security" rather than via ignore
    # annotations.
    - "no-read-only-root-fs"
    # Ollama (GPU/model management), Tika and SearXNG (upstream entrypoints)
    # run as root by upstream requirement. These are the only such containers
    # and carry assurance.platform/security-exception annotations.
    - "run-as-non-root"
    # The only matches are Authelia's AUTHELIA_*_SECRET_FILE variables, which
    # hold *file paths* to secrets mounted from a Secret volume — i.e. exactly
    # the "mount the secret as a file" pattern the check recommends, not raw
    # secret values. All other credentials use valueFrom.secretKeyRef.
    - "env-var-secret"
