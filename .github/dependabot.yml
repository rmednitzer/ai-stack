# Dependabot configuration for ai-stack Helm chart
# Keeps GitHub Actions up to date with SHA-pinned references.
#
# NOTE: Dependabot is used for GitHub Actions and Dockerfile dependencies.
# Helm `values.yaml` image updates are handled by Renovate (`renovate.json5`).

version: 2

registries: {}

updates:
  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Vienna"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "rmednitzer"
    groups:
      # Group all minor/patch action updates into a single PR
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Keep major updates as individual PRs for careful review
    open-pull-requests-limit: 5

  # --- Docker (base images in the repo's Dockerfiles only) ---
  # Scoped to the actual Dockerfile dirs so Dependabot does NOT scan
  # values.yaml; Helm values image updates (tag+digest, ADR-002) are
  # owned by Renovate (renovate.json5, helm-values + pinDigests).
  - package-ecosystem: "docker"
    directories:
      - "/files/ingestion-worker"
      - "/files/pydanticai"
    schedule:
      interval: "weekly"
      day: "wednesday"
      timezone: "Europe/Vienna"
    labels:
      - "dependencies"
      - "container-images"
    reviewers:
      - "rmednitzer"
    open-pull-requests-limit: 5

  # --- Python (hashed requirements locks under files/) ---
  # Each dir carries a requirements.in (ranges) + a uv-compiled, hashed,
  # universal requirements.txt lock. Review bot PRs against the Makefile
  # lock targets (pydanticai-lock / ingestion-worker-lock): the committed
  # locks must stay universal (env markers) and fully hashed.
  - package-ecosystem: "pip"
    directories:
      - "/files/ingestion-worker"
      - "/files/pydanticai"
    schedule:
      interval: "weekly"
      day: "wednesday"
      timezone: "Europe/Vienna"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "rmednitzer"
    open-pull-requests-limit: 5
