name: Docs

# Markdown-only validation. Kept separate from lint.yaml so documentation PRs
# don't spin up the chart-validation jobs (and vice versa).
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/scripts/check_md_links.py"
      - ".github/workflows/docs.yaml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/scripts/check_md_links.py"
      - ".github/workflows/docs.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      # Deterministic, offline check of every relative link and #anchor across
      # all markdown files (GitHub-accurate heading slugs). No network, so it
      # can't flake on external endpoints — it guards internal link rot, which
      # is the failure mode that recurs as docs are renamed/moved.
      - name: Check markdown links and anchors
        run: python3 .github/scripts/check_md_links.py
