name: Release Helm Chart

# Publishes the chart to the GitHub Container Registry as an OCI artifact
# whenever a semver tag (vX.Y.Z) is pushed. The tag is the source of truth
# for the released chart version; Chart.yaml must already match.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.2.0). Leave blank to release HEAD as a dry-run."
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.0

      - name: Verify Chart.yaml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CHART_VERSION=$(awk '/^version:/ { print $2 }' Chart.yaml | tr -d '"')
          echo "Tag: ${TAG_VERSION}"
          echo "Chart.yaml: ${CHART_VERSION}"
          if [ "${TAG_VERSION}" != "${CHART_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match Chart.yaml version (${CHART_VERSION})"
            exit 1
          fi

      - name: Helm lint
        run: helm lint .

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package . --destination dist
          PKG=$(ls dist/ai-stack-*.tgz | head -1)
          echo "package=${PKG}" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "${PKG}" .tgz | sed 's/^ai-stack-//')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart to OCI registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          helm push "${{ steps.package.outputs.package }}" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Generate provenance attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.package.outputs.package }}

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart-${{ steps.package.outputs.version }}
          path: dist/*.tgz
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES_FILE=$(mktemp)
          {
            echo "## ai-stack ${GITHUB_REF_NAME}"
            echo ""
            echo "Helm chart published as OCI artifact:"
            echo ""
            echo '```bash'
            echo "helm install ai-stack oci://ghcr.io/${{ github.repository_owner }}/charts/ai-stack \\"
            echo "  --version ${{ steps.package.outputs.version }} \\"
            echo "  --namespace ai-stack --create-namespace"
            echo '```'
            echo ""
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for full release notes."
          } > "$NOTES_FILE"

          gh release create "${GITHUB_REF_NAME}" \
            --title "ai-stack ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES_FILE" \
            "${{ steps.package.outputs.package }}" \
            sbom.cdx.json
