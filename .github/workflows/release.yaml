name: Release Helm Chart

# Publishes the chart to the GitHub Container Registry as an OCI artifact
# whenever a semver tag (vX.Y.Z) is pushed. The tag is the source of truth
# for the released chart version; Chart.yaml must already match.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.2.0). Leave blank to release HEAD as a dry-run."
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.1

      - name: Resolve effective release tag
        id: ref
        # Computes a single is_release flag and effective tag name that work
        # consistently for both `push` (refs/tags/v*) and `workflow_dispatch`
        # (where github.ref is a branch ref but inputs.tag may name a tag).
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            EFFECTIVE_TAG="${INPUT_TAG}"
            IS_RELEASE=true
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            EFFECTIVE_TAG="${GITHUB_REF_NAME}"
            IS_RELEASE=true
          else
            EFFECTIVE_TAG=""
            IS_RELEASE=false
          fi
          echo "tag=${EFFECTIVE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Effective tag: ${EFFECTIVE_TAG:-<none>} (is_release=${IS_RELEASE})"

      - name: Verify Chart.yaml version matches tag
        if: steps.ref.outputs.is_release == 'true'
        env:
          EFFECTIVE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${EFFECTIVE_TAG#v}"
          CHART_VERSION=$(awk '/^version:/ { print $2 }' Chart.yaml | tr -d '"')
          echo "Tag: ${TAG_VERSION}"
          echo "Chart.yaml: ${CHART_VERSION}"
          if [ "${TAG_VERSION}" != "${CHART_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match Chart.yaml version (${CHART_VERSION})"
            exit 1
          fi

      - name: Helm lint
        run: helm lint .

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package . --destination dist
          PKG=$(ls dist/ai-stack-*.tgz | head -1)
          echo "package=${PKG}" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "${PKG}" .tgz | sed 's/^ai-stack-//')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.ref.outputs.is_release == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_USER" --password-stdin

      - name: Push chart to OCI registry
        id: push
        if: steps.ref.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          helm push "${{ steps.package.outputs.package }}" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee /tmp/helm-push.log
          # Match the digest token by shape (sha256:<64 hex>) anywhere in the
          # output rather than by field position, so a helm output-format change
          # cannot silently feed a bad value into signing. Validate before use.
          DIGEST=$(grep -oiE 'sha256:[0-9a-f]{64}' /tmp/helm-push.log | head -n1)
          if ! printf '%s' "${DIGEST}" | grep -qiE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not parse a valid chart digest (sha256:<64 hex>) from helm push output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed chart digest: ${DIGEST}"

      - name: Install cosign
        if: steps.ref.outputs.is_release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published chart (keyless, B5 / ADR-014)
        if: steps.ref.outputs.is_release == 'true'
        # Keyless OIDC signing: the job's id-token (Sigstore Fulcio) certifies the
        # workflow identity; the signature + cert go to the Rekor transparency log.
        # Verify with:
        #   cosign verify ghcr.io/<owner>/charts/ai-stack@<digest> \
        #     --certificate-identity-regexp '^https://github.com/<owner>/ai-stack/' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/ai-stack@${DIGEST}"

      - name: Generate provenance attestation
        if: steps.ref.outputs.is_release == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ steps.package.outputs.package }}

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart-${{ steps.package.outputs.version }}
          path: dist/*.tgz
          retention-days: 90

      - name: Create GitHub Release
        if: steps.ref.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE=$(mktemp)
          {
            echo "## ai-stack ${EFFECTIVE_TAG}"
            echo ""
            echo "Helm chart published as OCI artifact:"
            echo ""
            echo '```bash'
            echo "helm install ai-stack oci://ghcr.io/${{ github.repository_owner }}/charts/ai-stack \\"
            echo "  --version ${{ steps.package.outputs.version }} \\"
            echo "  --namespace ai-stack --create-namespace"
            echo '```'
            echo ""
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${EFFECTIVE_TAG}/CHANGELOG.md) for full release notes."
          } > "$NOTES_FILE"

          gh release create "${EFFECTIVE_TAG}" \
            --title "ai-stack ${EFFECTIVE_TAG}" \
            --notes-file "$NOTES_FILE" \
            "${{ steps.package.outputs.package }}" \
            sbom.cdx.json
