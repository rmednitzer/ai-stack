name: Lint and Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "values*.yaml"
      - "values.schema.json"
      - "templates/**"
      - "files/**"
      - "tests/**"
      - "argocd/**"
      - "sbom.cdx.json"
      - "zarf.yaml"
      - "ct.yaml"
      - ".kube-linter.yaml"
      - ".github/workflows/lint.yaml"
  push:
    branches: [main]

# Cancel any in-progress run for the same branch/PR to avoid wasted minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.1  # helm/helm

      - name: Helm lint (lab profile)
        run: helm lint .

      - name: Helm lint (prod profile)
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Helm template (lab profile)
        run: helm template ai-stack . --debug > /dev/null

      - name: Helm template (prod profile)
        run: helm template ai-stack . -f values.yaml -f values-prod.yaml --debug > /dev/null

  helm-unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.1  # helm/helm

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.0 --verify=false

      # Asserts the security claims the CTL/POL registry documents are actually
      # rendered: restricted securityContext, no token automount, scoped CORS,
      # opt-in sandbox runtimeClass, ephemeral storage default, and default-deny
      # NetworkPolicy / tool-plane ingress isolation (tests/).
      - name: Run chart unit tests
        run: helm unittest .

  worker-tests:
    # Unit tests for the async ingestion worker's Qdrant interaction (collection
    # bootstrap + per-task routing). The HTTP layer is mocked with respx, so no
    # backing services are needed. See files/ingestion-worker/test_worker.py.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --quiet -r files/ingestion-worker/requirements-dev.txt

      - name: Run worker unit tests
        run: python -m pytest files/ingestion-worker -q

  pydanticai-tests:
    # Unit tests for the Pydantic AI runtime's per-tenant retrieval filter (B3):
    # identity threaded from the agent run into the Qdrant query filter. The HTTP
    # layer is mocked with respx (TestModel stands in for the LLM), so no backing
    # services are needed. See files/pydanticai/test_app.py.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --quiet -r files/pydanticai/requirements-dev.txt

      - name: Run Pydantic AI unit tests
        run: python -m pytest files/pydanticai -q

  chart-testing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.1  # helm/helm

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Lint with chart-testing
        run: ct lint --config ct.yaml --charts .

  sbom-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install Python deps (check-jsonschema, PyYAML)
        run: pip install --quiet check-jsonschema pyyaml

      - name: Validate SBOM against CycloneDX 1.6 schema
        run: |
          check-jsonschema \
            --schemafile "https://raw.githubusercontent.com/CycloneDX/specification/1.6/schema/bom-1.6.schema.json" \
            sbom.cdx.json

      - name: Verify SBOM package version matches Chart.yaml
        # metadata.component.version is the chart-artifact version the SBOM
        # describes — version-bearing per AGENTS.md §6, but the parity checks
        # below only cover image entries, so this field has drifted unnoticed
        # before (left at 2.5.0 while the chart was already 2.7.0). Enforce it.
        run: |
          python3 - <<'PY'
          import json, re, sys
          sbom_v = json.load(open('sbom.cdx.json')).get('metadata', {}).get('component', {}).get('version', '')
          chart_v = ''
          for line in open('Chart.yaml'):
              m = re.match(r'^version:\s*(\S+)', line)
              if m:
                  chart_v = m.group(1).strip().strip('"\'')
                  break
          if sbom_v != chart_v:
              print(f"::error::sbom.cdx.json metadata.component.version={sbom_v!r} != Chart.yaml version={chart_v!r}. Sync the SBOM package version on every chart bump (AGENTS.md §6).", file=sys.stderr)
              sys.exit(1)
          print(f"::notice::SBOM package version matches Chart.yaml ({chart_v}).")
          PY

      - name: Verify SBOM component count matches values.yaml images
        run: |
          # Count unique image repositories in values.yaml
          VALUES_IMAGES=$(grep -cE '^\s+repository:' values.yaml)
          # Count components in SBOM
          SBOM_COMPONENTS=$(python3 -c "import json; print(len(json.load(open('sbom.cdx.json'))['components']))")
          echo "values.yaml images: $VALUES_IMAGES"
          echo "SBOM components: $SBOM_COMPONENTS"
          if [ "$VALUES_IMAGES" -ne "$SBOM_COMPONENTS" ]; then
            echo "::error::SBOM component count ($SBOM_COMPONENTS) does not match values.yaml image count ($VALUES_IMAGES). Update sbom.cdx.json."
            exit 1
          fi

      - name: Verify image-tag parity across values.yaml, sbom.cdx.json, zarf.yaml
        # Per ADR-001 §Decision[1], values.yaml is the source of truth for image
        # references; sbom.cdx.json and zarf.yaml are downstream artifacts that
        # must match. The count-only check above does not catch version drift
        # (e.g. PR #107 bumped values.yaml only without touching downstream
        # artifacts). This step closes the ADR-001 §Consequences follow-up by
        # enforcing per-component version parity. Component identity is the
        # image-repository basename (e.g. open-webui/open-webui -> open-webui).
        run: |
          python3 <<'PY'
          import sys, re, json
          import yaml

          def basename(s):
              return s.rsplit('/', 1)[-1] if '/' in s else s

          def values_images(node, out=None):
              if out is None:
                  out = {}
              if isinstance(node, dict):
                  if isinstance(node.get('repository'), str):
                      out[node['repository']] = str(node.get('tag', 'latest'))
                  for v in node.values():
                      values_images(v, out)
              elif isinstance(node, list):
                  for it in node:
                      values_images(it, out)
              return out

          def sbom_images(bom):
              # purl form (since 2.12.0): pkg:docker/<name>@<tag>?checksum=sha256:<hex>
              # — one '@' separator, digest in the checksum qualifier per the
              # purl spec. component.version still carries the full values.yaml
              # tag string (tag[@sha256:<hex>]); its tag part must equal the
              # purl version.
              out = {}
              issues = []
              for c in bom.get('components', []):
                  name = c.get('name', '')
                  version = str(c.get('version', ''))
                  purl = c.get('purl', '')
                  m = re.match(r'pkg:docker/([^@?]+)@([^?]+)', purl)
                  if m:
                      out[m.group(1)] = version
                      if version and m.group(2) != version.split('@', 1)[0]:
                          issues.append((name or m.group(1), version, m.group(2)))
                  elif name and version:
                      out[name] = version
              return out, issues

          def zarf_images(text):
              # Match `- repo:tag` and optionally `@sha256:<digest>`. The digest
              # is captured but the tag-only parity check ignores it; digest
              # parity is enforced via SBOM hashes and values.yaml.digest fields
              # per ADR-002.
              out = {}
              for m in re.finditer(r'^\s+-\s+([A-Za-z0-9_.\-/]+):([A-Za-z0-9_.\-]+)(?:@sha256:[a-f0-9]{64})?\s*$', text, re.M):
                  out[m.group(1)] = m.group(2)
              return out

          with open('values.yaml') as f:
              vals = yaml.safe_load(f)
          with open('sbom.cdx.json') as f:
              bom = json.load(f)
          with open('zarf.yaml') as f:
              ztext = f.read()

          v = values_images(vals)
          b, purl_issues = sbom_images(bom)
          z = zarf_images(ztext)

          if purl_issues:
              for name, vv, pv in purl_issues:
                  print(f"::error::sbom.cdx.json {name!r}: component.version={vv!r} but purl version={pv!r}", file=sys.stderr)
              sys.exit(2)

          # Tag-only parity: strip any @sha256:<digest> carried in the
          # values.yaml tag and SBOM component.version (zarf is already
          # digest-stripped by zarf_images). Digest parity is enforced by
          # the separate image-digest-parity step below.
          _tag = lambda t: t.split("@", 1)[0]
          vk = {basename(k): _tag(t) for k, t in v.items()}
          bk = {basename(k): _tag(t) for k, t in b.items()}
          zk = {basename(k): _tag(t) for k, t in z.items()}

          for label, src, norm in (('values.yaml', v, vk), ('sbom.cdx.json', b, bk), ('zarf.yaml', z, zk)):
              if len(src) != len(norm):
                  print(f"::error::{label}: image-name basename collision ({len(src)} sources, {len(norm)} after normalisation). Add explicit disambiguation.", file=sys.stderr)
                  sys.exit(2)

          all_keys = set(vk) | set(bk) | set(zk)
          missing = []
          for k in sorted(all_keys):
              where = [name for name, m in (('values.yaml', vk), ('sbom.cdx.json', bk), ('zarf.yaml', zk)) if k not in m]
              if where:
                  missing.append((k, where))
          if missing:
              for k, where in missing:
                  print(f"::error::Component {k!r} missing from: {', '.join(where)}", file=sys.stderr)
              sys.exit(1)

          drift = [(k, vk[k], bk[k], zk[k]) for k in sorted(all_keys) if not (vk[k] == bk[k] == zk[k])]
          if drift:
              for k, vv, bv, zv in drift:
                  print(f"::error::Version drift {k!r}: values.yaml={vv}, sbom.cdx.json={bv}, zarf.yaml={zv}", file=sys.stderr)
              print(f"::error::{len(drift)} component(s) divergent. Update sbom.cdx.json and zarf.yaml to match values.yaml per ADR-001 §Decision[1].", file=sys.stderr)
              sys.exit(1)

          print(f"::notice::Image-tag parity OK for {len(all_keys)} component(s) across values.yaml, sbom.cdx.json, zarf.yaml.")
          PY

      - name: Verify image-digest parity across values.yaml, sbom.cdx.json, zarf.yaml
        # Closes the ADR-002 §Consequences follow-up. The tag-parity step above
        # strips any @sha256 suffix; this step enforces that every component's
        # manifest digest is present and identical across all three artifacts.
        # The values.yaml tag is the single source of truth (Renovate appends
        # @sha256:<hex> to it when pin-digesting), so the digest is parsed
        # straight out of the tag — there is no separate `digest:` field.
        run: |
          python3 <<'PY'
          import sys, re, json
          import yaml

          def basename(s):
              return s.rsplit('/', 1)[-1] if '/' in s else s

          def values_digests(node, out=None):
              if out is None:
                  out = {}
              if isinstance(node, dict):
                  if isinstance(node.get('repository'), str):
                      tag = str(node.get('tag', ''))
                      digest = ''
                      if '@' in tag:
                          _, suffix = tag.split('@', 1)
                          if suffix.startswith('sha256:'):
                              digest = suffix
                      out[basename(node['repository'])] = digest
                  for v in node.values():
                      values_digests(v, out)
              elif isinstance(node, list):
                  for it in node:
                      values_digests(it, out)
              return out

          def sbom_digests(bom):
              # Digest source of record is the SHA-256 hashes[] entry; the purl
              # checksum qualifier (spec form since 2.12.0) must agree with it.
              out = {}
              issues = []
              for c in bom.get('components', []):
                  purl = c.get('purl', '')
                  m = re.match(r'pkg:docker/([^@?]+)@', purl)
                  if not m:
                      continue
                  h = [x for x in c.get('hashes', []) if x.get('alg') == 'SHA-256']
                  digest = 'sha256:' + h[0]['content'] if h else ''
                  out[basename(m.group(1))] = digest
                  qm = re.search(r'[?&]checksum=([^&]+)', purl)
                  if qm and qm.group(1) != digest:
                      issues.append((c.get('name') or m.group(1), qm.group(1), digest))
              return out, issues

          def zarf_digests(text):
              out = {}
              for m in re.finditer(r'^\s+-\s+([A-Za-z0-9_.\-/]+):[A-Za-z0-9_.\-]+@(sha256:[a-f0-9]{64})\s*$', text, re.M):
                  out[basename(m.group(1))] = m.group(2)
              # Record digest-less entries too, so a missing pin is caught.
              for m in re.finditer(r'^\s+-\s+([A-Za-z0-9_.\-/]+):[A-Za-z0-9_.\-]+\s*$', text, re.M):
                  out.setdefault(basename(m.group(1)), '')
              return out

          with open('values.yaml') as f:
              vals = yaml.safe_load(f)
          with open('sbom.cdx.json') as f:
              bom = json.load(f)
          with open('zarf.yaml') as f:
              ztext = f.read()

          v = values_digests(vals)
          b, checksum_issues = sbom_digests(bom)
          z = zarf_digests(ztext)

          if checksum_issues:
              for name, qual, digest in checksum_issues:
                  print(f"::error::sbom.cdx.json {name!r}: purl checksum qualifier={qual!r} but hashes[] SHA-256={digest!r}", file=sys.stderr)
              sys.exit(2)

          all_keys = sorted(set(v) | set(b) | set(z))
          bad = False
          for k in all_keys:
              dv, db, dz = v.get(k, ''), b.get(k, ''), z.get(k, '')
              if not (dv == db == dz and dv):
                  print(f"::error::Digest drift/missing {k!r}: values.yaml={dv or '<none>'}, sbom.cdx.json={db or '<none>'}, zarf.yaml={dz or '<none>'}", file=sys.stderr)
                  bad = True
          if bad:
              print("::error::Image-digest parity failed. Per ADR-002 every image must be digest-pinned identically across values.yaml, sbom.cdx.json, and zarf.yaml.", file=sys.stderr)
              sys.exit(1)
          print(f"::notice::Image-digest parity OK for {len(all_keys)} component(s).")
          PY

  syft-sbom:
    # Image pulls are expensive and hit registry rate-limits; run only on merged commits.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Syft binary
        id: cache-syft
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/bin/syft
          key: syft-v1.42.3

      - name: Install Syft
        if: steps.cache-syft.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.42.3  # anchore/syft
          syft version

      - name: Extract image references from values.yaml
        id: images
        run: |
          python3 -c "
          import yaml
          # Recursive walk — same image model as the parity checks. A top-level
          # walk silently skipped nested image blocks (postgres.cnpg.image, the
          # aiGateway controller/extproc), leaving them out of the deep
          # SBOM/CVE scans even though they are tag/digest-parity enforced.
          def walk(node, out):
              if isinstance(node, dict):
                  img = node.get('image')
                  if isinstance(img, dict) and img.get('repository'):
                      out.append(f\"{img['repository']}:{img.get('tag', 'latest')}\")
                  for v in node.values():
                      walk(v, out)
              elif isinstance(node, list):
                  for it in node:
                      walk(it, out)
          with open('values.yaml') as f:
              vals = yaml.safe_load(f)
          refs = []
          walk(vals, refs)
          print('\n'.join(dict.fromkeys(refs)))
          " | tee /tmp/images.txt
          echo "count=$(wc -l < /tmp/images.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Generate deep SBOMs with Syft
        run: |
          set -euo pipefail
          mkdir -p syft-sbom-output
          FAILED=0
          TOTAL=0
          while IFS= read -r IMAGE; do
            TOTAL=$((TOTAL + 1))
            SAFE_NAME=$(echo "$IMAGE" | tr '/:' '__')
            echo "::group::Scanning ${IMAGE}"
            if syft "registry:${IMAGE}" \
                -o "cyclonedx-json=syft-sbom-output/${SAFE_NAME}.cdx.json" \
                --quiet; then
              COMPONENTS=$(python3 -c "
          import json
          bom = json.load(open('syft-sbom-output/${SAFE_NAME}.cdx.json'))
          print(len(bom.get('components', [])))
          ")
              echo "OK ${IMAGE}: ${COMPONENTS} components"
            else
              FAILED=$((FAILED + 1))
              rm -f "syft-sbom-output/${SAFE_NAME}.cdx.json"
              echo "::error::Syft scan failed for ${IMAGE}"
            fi
            echo "::endgroup::"
          done < /tmp/images.txt

          echo ""
          echo "=== Summary: $((TOTAL - FAILED))/${TOTAL} images scanned ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::${FAILED}/${TOTAL} image(s) could not be scanned (registry auth, rate-limit, or missing manifest)"
          fi

      - name: Cache CycloneDX CLI
        id: cache-cyclonedx
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/bin/cyclonedx
          key: cyclonedx-v0.32.0

      - name: Install CycloneDX CLI
        if: steps.cache-cyclonedx.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CDX_VERSION="v0.32.0"  # CycloneDX/cyclonedx-cli
          CDX_SHA256="454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1"
          curl -sSfL "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CDX_VERSION}/cyclonedx-linux-x64" \
            -o /usr/local/bin/cyclonedx
          echo "${CDX_SHA256}  /usr/local/bin/cyclonedx" | sha256sum -c -
          chmod +x /usr/local/bin/cyclonedx
          cyclonedx --version

      - name: Validate generated SBOMs against CycloneDX schema
        run: |
          # Native CycloneDX validation (seconds), replacing Python check-jsonschema
          # which took ~1h on large deep SBOMs. Spec version is read per file so a
          # future syft bump (1.6 -> 1.7) needs no workflow change.
          shopt -s nullglob
          sboms=(syft-sbom-output/*.cdx.json)
          if [ "${#sboms[@]}" -eq 0 ]; then
            echo "::error::No SBOMs were generated in syft-sbom-output/ (all image scans failed)"
            exit 1
          fi
          FAILED=0
          for f in "${sboms[@]}"; do
            echo "Validating $(basename "$f")"
            spec_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["specVersion"])' "$f" 2>/dev/null) || true
            if [ -z "${spec_version}" ]; then
              echo "::error::$(basename "$f"): could not read specVersion (missing or invalid CycloneDX JSON)"
              FAILED=$((FAILED + 1))
              continue
            fi
            if ! cyclonedx validate \
              --input-file "$f" \
              --input-format json \
              --input-version "v${spec_version//./_}" \
              --fail-on-errors; then
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} SBOM(s) failed CycloneDX schema validation"
            exit 1
          fi

      - name: Upload deep SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syft-deep-sboms
          path: syft-sbom-output/
          retention-days: 90

  cve-scan:
    # Image pulls are expensive and hit registry rate-limits; run only on merged commits.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enforce CVE-exception expiry (.grype.yaml)
        # The gate below is blocking. The only relief valve is a time-boxed
        # ignore in .grype.yaml; this guard fails the build if any exception is
        # missing an `expires:` date or is past it, so an exception cannot
        # silently become permanent. See docs/operations/hardening-guide.md.
        run: python3 .github/scripts/check_grype_exceptions.py

      - name: Cache Grype binary
        id: cache-grype
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/bin/grype
          key: grype-v0.110.0

      - name: Install Grype
        if: steps.cache-grype.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin v0.110.0  # anchore/grype
          grype version

      - name: Extract image references from values.yaml
        run: |
          python3 -c "
          import yaml
          # Recursive walk — same image model as the parity checks. A top-level
          # walk silently skipped nested image blocks (postgres.cnpg.image, the
          # aiGateway controller/extproc), leaving them out of the deep
          # SBOM/CVE scans even though they are tag/digest-parity enforced.
          def walk(node, out):
              if isinstance(node, dict):
                  img = node.get('image')
                  if isinstance(img, dict) and img.get('repository'):
                      out.append(f\"{img['repository']}:{img.get('tag', 'latest')}\")
                  for v in node.values():
                      walk(v, out)
              elif isinstance(node, list):
                  for it in node:
                      walk(it, out)
          with open('values.yaml') as f:
              vals = yaml.safe_load(f)
          refs = []
          walk(vals, refs)
          print('\n'.join(dict.fromkeys(refs)))
          " | tee /tmp/images.txt

      - name: Scan images for CVEs with Grype
        run: |
          set -euo pipefail
          mkdir -p grype-reports
          CRITICAL=0
          TOTAL=0
          while IFS= read -r IMAGE; do
            TOTAL=$((TOTAL + 1))
            SAFE_NAME=$(echo "$IMAGE" | tr '/:' '__')
            echo "::group::Scanning ${IMAGE}"
            if grype "registry:${IMAGE}" \
                --config .grype.yaml \
                --output json \
                --file "grype-reports/${SAFE_NAME}.json" \
                --fail-on critical 2>&1; then
              echo "OK ${IMAGE}: no critical CVEs"
            else
              EXIT_CODE=$?
              if [ "$EXIT_CODE" -eq 1 ]; then
                CRITICAL=$((CRITICAL + 1))
                echo "::warning::Critical CVE(s) found in ${IMAGE} — review grype-reports artifacts"
              else
                echo "::warning::Grype scan issue for ${IMAGE} (exit code ${EXIT_CODE})"
              fi
            fi
            echo "::endgroup::"
          done < /tmp/images.txt

          echo ""
          echo "=== CVE Scan Summary: ${TOTAL} images scanned, ${CRITICAL} with critical CVEs ==="
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::${CRITICAL} image(s) have critical CVEs. Update the affected image, or add a time-boxed exception to .grype.yaml (advisory + expiry). See docs/operations/hardening-guide.md."
            exit 1
          fi

      - name: Upload Grype reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-cve-reports
          path: grype-reports/
          retention-days: 90

  kubeconform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.1  # helm/helm

      - name: Cache kubeconform binary
        id: cache-kubeconform
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-v0.7.0

      - name: Install kubeconform
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        env:
          KUBECONFORM_VERSION: "v0.7.0"  # renovate: depName=yannh/kubeconform
          KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
        run: |
          curl -fsSLo kubeconform-linux-amd64.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests (lab profile)
        env:
          KUBERNETES_VERSION: "1.32.0"  # kubernetes/kubernetes
        run: |
          helm template ai-stack . | kubeconform \
            -strict \
            -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -skip CustomResourceDefinition,ServiceMonitor,PrometheusRule,HTTPRoute,Gateway,AIGatewayRoute,AIServiceBackend,BackendSecurityPolicy,Backend,BackendTrafficPolicy,SecurityPolicy,Cluster,Pooler,ScheduledBackup

      - name: Validate manifests (prod profile)
        env:
          KUBERNETES_VERSION: "1.32.0"  # kubernetes/kubernetes
        run: |
          helm template ai-stack . -f values.yaml -f values-prod.yaml | kubeconform \
            -strict \
            -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -skip CustomResourceDefinition,ServiceMonitor,PrometheusRule,HTTPRoute,Gateway,AIGatewayRoute,AIServiceBackend,BackendSecurityPolicy,Backend,BackendTrafficPolicy,SecurityPolicy,Cluster,Pooler,ScheduledBackup

      # GitOps manifests live outside the chart (helmignored), so validate the
      # ArgoCD Application/AppProject CRs against the Argo schemas separately —
      # this set is otherwise unchecked and has drifted before.
      - name: Validate ArgoCD manifests (argocd/)
        run: |
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/

  kube-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.1  # helm/helm

      - name: Cache kube-linter binary
        id: cache-kube-linter
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/bin/kube-linter
          key: kube-linter-v0.8.3

      - name: Install kube-linter
        if: steps.cache-kube-linter.outputs.cache-hit != 'true'
        env:
          KUBE_LINTER_VERSION: "v0.8.3"  # renovate: depName=stackrox/kube-linter
          KUBE_LINTER_SHA256: "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"
        run: |
          curl -fsSLo kube-linter.tar.gz "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          echo "${KUBE_LINTER_SHA256}  kube-linter.tar.gz" | sha256sum -c -
          tar xzf kube-linter.tar.gz kube-linter
          sudo mv kube-linter /usr/local/bin/
          kube-linter version

      # Policy linting of rendered manifests, complementing kubeconform's schema
      # check. Config (.kube-linter.yaml) documents the few checks excluded to
      # match the chart's security model; all other default checks are blocking.
      - name: kube-linter (lab profile)
        run: helm template ai-stack . | kube-linter lint --config .kube-linter.yaml -

      - name: kube-linter (prod profile)
        run: helm template ai-stack . -f values.yaml -f values-prod.yaml | kube-linter lint --config .kube-linter.yaml -

      - name: kube-linter (all optional components enabled)
        run: |
          helm template ai-stack . \
            --set openTerminal.enabled=true,mcpo.enabled=true \
            --set langgraph.enabled=true,pydanticai.enabled=true,postgres.enabled=true,ingestionWorker.enabled=true \
            --set authelia.enabled=true,global.otel.enabled=true \
            | kube-linter lint --config .kube-linter.yaml -

  zarf-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.1  # helm/helm

      - name: Cache Zarf binary
        id: cache-zarf
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/bin/zarf
          key: zarf-v0.77.0

      - name: Install Zarf
        if: steps.cache-zarf.outputs.cache-hit != 'true'
        env:
          ZARF_VERSION: "v0.77.0"  # renovate: depName=zarf-dev/zarf
          ZARF_SHA256: "7e335ffe9861d6ce254d75b31fde9c96c0fa83469c82cd20228b27e63d18dd85"
        run: |
          curl -fsSLo zarf "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64"
          echo "${ZARF_SHA256}  zarf" | sha256sum -c -
          sudo install -m 0755 zarf /usr/local/bin/zarf
          zarf version

      # Validate zarf.yaml against the Zarf package schema (catches the
      # chart-variable / metadata drift that the image-parity check cannot see).
      - name: Zarf dev lint
        run: zarf dev lint
