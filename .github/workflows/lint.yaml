name: Lint and Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "values*.yaml"
      - "templates/**"
      - "sbom.cdx.json"
      - ".github/workflows/lint.yaml"
  push:
    branches: [main]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.0  # renovate: depName=helm/helm

      - name: Helm lint (lab profile)
        run: helm lint .

      - name: Helm lint (prod profile)
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Helm template (lab profile)
        run: helm template ai-stack . --debug > /dev/null

      - name: Helm template (prod profile)
        run: helm template ai-stack . -f values.yaml -f values-prod.yaml --debug > /dev/null

  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.0  # renovate: depName=helm/helm

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Lint with chart-testing
        run: ct lint --config ct.yaml --charts .

  sbom-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install check-jsonschema
        run: pip install --quiet check-jsonschema

      - name: Validate SBOM against CycloneDX 1.6 schema
        run: |
          check-jsonschema \
            --schemafile "https://raw.githubusercontent.com/CycloneDX/specification/1.6/schema/bom-1.6.schema.json" \
            sbom.cdx.json

      - name: Verify SBOM component count matches values.yaml images
        run: |
          # Count unique image repositories in values.yaml
          VALUES_IMAGES=$(grep -cE '^\s+repository:' values.yaml)
          # Count components in SBOM
          SBOM_COMPONENTS=$(python3 -c "import json; print(len(json.load(open('sbom.cdx.json'))['components']))")
          echo "values.yaml images: $VALUES_IMAGES"
          echo "SBOM components: $SBOM_COMPONENTS"
          if [ "$VALUES_IMAGES" -ne "$SBOM_COMPONENTS" ]; then
            echo "::error::SBOM component count ($SBOM_COMPONENTS) does not match values.yaml image count ($VALUES_IMAGES). Update sbom.cdx.json."
            exit 1
          fi

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.0  # renovate: depName=helm/helm

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests (lab profile)
        env:
          KUBERNETES_VERSION: "1.32.0"  # renovate: depName=kubernetes/kubernetes
        run: |
          helm template ai-stack . | kubeconform \
            -strict \
            -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -skip CustomResourceDefinition,ServiceMonitor

      - name: Validate manifests (prod profile)
        env:
          KUBERNETES_VERSION: "1.32.0"  # renovate: depName=kubernetes/kubernetes
        run: |
          helm template ai-stack . -f values.yaml -f values-prod.yaml | kubeconform \
            -strict \
            -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -skip CustomResourceDefinition,ServiceMonitor
