name: Bug Report
description: Report a problem with the ai-stack Helm chart
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: input
    id: chart-version
    attributes:
      label: Chart Version
      description: Output of `helm show chart .` or the version from `Chart.yaml`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: kubernetes-version
    attributes:
      label: Kubernetes Version
      description: Output of `kubectl version --short`
      placeholder: "1.32.0"
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Values Profile
      description: Which values profile are you using?
      options:
        - lab (default values.yaml)
        - prod (values.yaml + values-prod.yaml)
        - custom overlay
    validations:
      required: true

  - type: textarea
    id: affected-components
    attributes:
      label: Affected Component(s)
      description: Which component(s) are affected? (e.g. openwebui, ollama, qdrant, otelCollector)
      placeholder: "openwebui"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. `helm install ai-stack . -f values.yaml`
        2. `kubectl get pods -n ai-stack`
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include relevant error messages or logs.
    validations:
      required: true

  - type: textarea
    id: helm-lint
    attributes:
      label: Helm Lint Output
      description: Output of `helm lint .` (and `helm lint . -f values.yaml -f values-prod.yaml` if using prod profile)
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, relevant values overrides, or screenshots.
