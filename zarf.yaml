# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
# =============================================================================
# Zarf Package Definition — ai-stack
# =============================================================================
# Creates a self-contained, declarative package for deploying ai-stack into
# air-gapped Kubernetes clusters. Zarf handles image mirroring, Helm chart
# bundling, and in-cluster registry injection automatically.
#
# Build:   zarf package create --confirm
# Deploy:  zarf package deploy zarf-package-ai-stack-amd64-1.0.0.tar.zst --confirm
# =============================================================================

kind: ZarfPackageConfig
metadata:
  name: ai-stack
  description: >-
    AI inference and tooling stack for air-gapped Kubernetes deployments.
    Includes Open WebUI, Ollama, Qdrant, Tika, SearXNG, and supporting services.
  version: 1.0.0
  url: https://github.com/rmednitzer/ai-stack
  authors: Roman Mednitzer <r.mednitzer@outlook.com>

components:
  # ---------------------------------------------------------------------------
  # Core stack — always deployed
  # ---------------------------------------------------------------------------
  - name: ai-stack
    required: true
    description: "Core ai-stack Helm chart with all default components"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 1.0.0
        valuesFiles:
          - values.yaml
    images:
      # Open WebUI
      - ghcr.io/open-webui/open-webui:v0.8.10
      # Ollama
      - ollama/ollama:0.17.7
      # Qdrant
      - qdrant/qdrant:v1.13.2
      # Apache Tika
      - apache/tika:3.0.0.0
      # SearXNG
      - searxng/searxng:2026.3.10-8b95b2058
      # Open Terminal
      - ghcr.io/open-webui/open-terminal:0.1.2
      # Pipelines
      - ghcr.io/open-webui/pipelines:0.1.2
      # Valkey
      - valkey/valkey:8.0
      # Ingestion worker
      - python:3.12-slim

  # ---------------------------------------------------------------------------
  # Optional: GPU Workbench
  # ---------------------------------------------------------------------------
  - name: workbench
    required: false
    description: "GPU-enabled JupyterLab workbench for ML experimentation"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 1.0.0
        valuesFiles:
          - values.yaml
        variables:
          - name: WORKBENCH_ENABLED
            path: workbench.enabled
            default: "true"
    images:
      - quay.io/jupyter/pytorch-notebook:cuda12-python-3.11

  # ---------------------------------------------------------------------------
  # Optional: LangGraph agentic workflows
  # ---------------------------------------------------------------------------
  - name: langgraph
    required: false
    description: "LangGraph API server with PostgreSQL for agentic workflows"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 1.0.0
        valuesFiles:
          - values.yaml
        variables:
          - name: LANGGRAPH_ENABLED
            path: langgraph.enabled
            default: "true"
          - name: POSTGRES_ENABLED
            path: postgres.enabled
            default: "true"
    images:
      - docker.io/langchain/langgraph-api:0.2
      - docker.io/library/postgres:16-alpine

  # ---------------------------------------------------------------------------
  # Optional: MCPO (MCP-to-OpenAPI proxy)
  # ---------------------------------------------------------------------------
  - name: mcpo
    required: false
    description: "MCPO server for MCP tool integration"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 1.0.0
        valuesFiles:
          - values.yaml
        variables:
          - name: MCPO_ENABLED
            path: mcpo.enabled
            default: "true"
    images:
      - ghcr.io/open-webui/mcpo:0.2.0

  # ---------------------------------------------------------------------------
  # Optional: OpenTelemetry Collector
  # ---------------------------------------------------------------------------
  - name: otel-collector
    required: false
    description: "OpenTelemetry Collector for observability"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 1.0.0
        valuesFiles:
          - values.yaml
        variables:
          - name: OTEL_ENABLED
            path: global.otel.enabled
            default: "true"
    images:
      - otel/opentelemetry-collector-contrib:0.116.0
