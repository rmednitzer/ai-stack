# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
# =============================================================================
# Zarf Package Definition — ai-stack
# =============================================================================
# Creates a self-contained, declarative package for deploying ai-stack into
# air-gapped Kubernetes clusters. Zarf handles image mirroring, Helm chart
# bundling, and in-cluster registry injection automatically.
#
# Build:   zarf package create --confirm
# Deploy:  zarf package deploy zarf-package-ai-stack-amd64-2.12.0.tar.zst --confirm
# =============================================================================

kind: ZarfPackageConfig
metadata:
  name: ai-stack
  description: >-
    AI inference and tooling stack for air-gapped Kubernetes deployments.
    Includes Open WebUI, Ollama, Qdrant, Tika, SearXNG, and supporting services.
  version: 2.12.0
  url: https://github.com/rmednitzer/ai-stack
  authors: Roman Mednitzer <r.mednitzer@outlook.com>

# Deploy-time toggles for the optional components below. Each is mapped to the
# matching Helm `enabled` value by a component's chart `variables` entry and
# defaults to "true", so selecting an optional Zarf component enables it.
# Override at deploy time, e.g. `zarf package deploy ... --set LANGGRAPH_ENABLED=false`.
variables:
  - name: LANGGRAPH_ENABLED
    description: "Set langgraph.enabled when deploying the langgraph component"
    default: "true"
  - name: PYDANTICAI_ENABLED
    description: "Set pydanticai.enabled when deploying the pydanticai component"
    default: "true"
  - name: POSTGRES_ENABLED
    description: "Set postgres.enabled (required by the langgraph and pydanticai components)"
    default: "true"
  - name: MCPO_ENABLED
    description: "Set mcpo.enabled when deploying the mcpo component"
    default: "true"
  - name: OTEL_ENABLED
    description: "Set global.otel.enabled when deploying the otel-collector component"
    default: "true"
  - name: AUTHELIA_ENABLED
    description: "Set authelia.enabled when deploying the authelia component"
    default: "true"
  - name: AI_GATEWAY_ENABLED
    description: "Set aiGateway.enabled when deploying the ai-gateway component"
    default: "true"
  - name: POSTGRES_MODE
    description: "Set postgres.mode when deploying the postgres-cnpg component (standalone | cnpg | external)"
    default: "cnpg"

components:
  # ---------------------------------------------------------------------------
  # Core stack — always deployed
  # ---------------------------------------------------------------------------
  - name: ai-stack
    required: true
    description: "Core ai-stack Helm chart with all default components"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.12.0
        valuesFiles:
          - values.yaml
    images:
      # Open WebUI
      - ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
      # Ollama
      - ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
      # Qdrant
      - qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
      # Apache Tika
      - apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
      # SearXNG
      - searxng/searxng:2026.5.31-300695de5@sha256:75e85884da87a717655d6313421c8fb42aede84219b06873311179ae830ab396
      # Open Terminal
      - ghcr.io/open-webui/open-terminal:0.11.34@sha256:5e040fe357ce4fbd3d5e59c40247dd32172fa10c51c22ded3a7843e739d06a0e
      # Valkey
      - valkey/valkey:9.1.1@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
      # Ingestion worker
      - python:3.14-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc

  # ---------------------------------------------------------------------------
  # Optional: LangGraph agentic workflows
  # ---------------------------------------------------------------------------
  - name: langgraph
    required: false
    description: "LangGraph API server with PostgreSQL for agentic workflows"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.12.0
        valuesFiles:
          - values.yaml
        variables:
          - name: LANGGRAPH_ENABLED
            description: "Maps the LANGGRAPH_ENABLED variable to langgraph.enabled"
            path: langgraph.enabled
          - name: POSTGRES_ENABLED
            description: "Maps the POSTGRES_ENABLED variable to postgres.enabled"
            path: postgres.enabled
    images:
      - docker.io/langchain/langgraph-server:0.12-py3.12@sha256:a7769b0e64ce7a050612e54f80228b7ebb24c5ca6ee817020a6b2f876d1f8077
      - docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15

  # ---------------------------------------------------------------------------
  # Optional: Pydantic AI agentic runtime (MIT alternative to LangGraph)
  # ---------------------------------------------------------------------------
  - name: pydanticai
    required: false
    description: "Pydantic AI agent server (durable execution via DBOS + PostgreSQL)"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.12.0
        valuesFiles:
          - values.yaml
        variables:
          - name: PYDANTICAI_ENABLED
            description: "Maps the PYDANTICAI_ENABLED variable to pydanticai.enabled"
            path: pydanticai.enabled
          - name: POSTGRES_ENABLED
            description: "Maps the POSTGRES_ENABLED variable to postgres.enabled"
            path: postgres.enabled
    images:
      - ghcr.io/astral-sh/uv:python3.13-trixie-slim@sha256:5f3c58899cb4ab5b723f81641d6aed08968e6c93f9a84641321ae66ba7103f42
      - docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15

  # ---------------------------------------------------------------------------
  # Optional: CloudNativePG PostgreSQL (postgres.mode=cnpg, production HA)
  # Mirrors the CNPG operand image so the regulated datastore participates in
  # the air-gap supply chain; the CNPG operator itself is BYO (pre-installed),
  # exactly as the ai-gateway component mirrors images for a BYO controller.
  # ---------------------------------------------------------------------------
  - name: postgres-cnpg
    required: false
    description: "CloudNativePG operand image + postgres.mode=cnpg wiring (requires the BYO CNPG operator)"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.12.0
        valuesFiles:
          - values.yaml
        variables:
          - name: POSTGRES_ENABLED
            description: "Maps the POSTGRES_ENABLED variable to postgres.enabled"
            path: postgres.enabled
          - name: POSTGRES_MODE
            description: "Maps the POSTGRES_MODE variable to postgres.mode"
            path: postgres.mode
    images:
      - ghcr.io/cloudnative-pg/postgresql:18@sha256:7af186660aead1b948d827ef1c52c20a8d2cb7b2a4089424b8f612e0a61dc2f9

  # ---------------------------------------------------------------------------
  # Optional: MCPO (MCP-to-OpenAPI proxy)
  # ---------------------------------------------------------------------------
  - name: mcpo
    required: false
    description: "MCPO server for MCP tool integration"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.12.0
        valuesFiles:
          - values.yaml
        variables:
          - name: MCPO_ENABLED
            description: "Maps the MCPO_ENABLED variable to mcpo.enabled"
            path: mcpo.enabled
    images:
      - ghcr.io/open-webui/mcpo:main@sha256:1e82c9555c19e50b80745705f32b47a2647589f35279527b5118ecd3a71bd467

  # ---------------------------------------------------------------------------
  # Optional: OpenTelemetry Collector
  # ---------------------------------------------------------------------------
  - name: otel-collector
    required: false
    description: "OpenTelemetry Collector for observability"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.12.0
        valuesFiles:
          - values.yaml
        variables:
          - name: OTEL_ENABLED
            description: "Maps the OTEL_ENABLED variable to global.otel.enabled"
            path: global.otel.enabled
    images:
      - otel/opentelemetry-collector-contrib:0.158.0@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5

  # ---------------------------------------------------------------------------
  # Optional: Authelia (OIDC/SSO/MFA)
  # ---------------------------------------------------------------------------
  - name: authelia
    required: false
    description: "Authelia identity provider for OIDC/SSO/MFA"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.12.0
        valuesFiles:
          - values.yaml
        variables:
          - name: AUTHELIA_ENABLED
            description: "Maps the AUTHELIA_ENABLED variable to authelia.enabled"
            path: authelia.enabled
    images:
      - ghcr.io/authelia/authelia:4.39.20@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b

  # ---------------------------------------------------------------------------
  # Optional: Envoy AI Gateway (governed model-egress; BYO controller, ADR-006)
  # The chart emits only the AI Gateway CRs; these images are mirrored so the
  # platform can install the upstream controller chart in an air-gap.
  # ---------------------------------------------------------------------------
  - name: ai-gateway
    required: false
    description: "Envoy AI Gateway controller + extproc images (mirrored for the BYO controller install)"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.12.0
        valuesFiles:
          - values.yaml
        variables:
          - name: AI_GATEWAY_ENABLED
            description: "Maps the AI_GATEWAY_ENABLED variable to aiGateway.enabled"
            path: aiGateway.enabled
    images:
      - docker.io/envoyproxy/ai-gateway-controller:v1.0.0@sha256:8efefd3154d70205d6400055c93f982602f4ad7d9ffc32e97e6373d97e549ef0
      - docker.io/envoyproxy/ai-gateway-extproc:v1.0.0@sha256:a38ac314b2b977561be3deaa722138ecb04a91e97122807cef08fccda880fa7e
