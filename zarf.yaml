# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
# =============================================================================
# Zarf Package Definition — ai-stack
# =============================================================================
# Creates a self-contained, declarative package for deploying ai-stack into
# air-gapped Kubernetes clusters. Zarf handles image mirroring, Helm chart
# bundling, and in-cluster registry injection automatically.
#
# Build:   zarf package create --confirm
# Deploy:  zarf package deploy zarf-package-ai-stack-amd64-2.2.0.tar.zst --confirm
# =============================================================================

kind: ZarfPackageConfig
metadata:
  name: ai-stack
  description: >-
    AI inference and tooling stack for air-gapped Kubernetes deployments.
    Includes Open WebUI, Ollama, Qdrant, Tika, SearXNG, and supporting services.
  version: 2.2.0
  url: https://github.com/rmednitzer/ai-stack
  authors: Roman Mednitzer <r.mednitzer@outlook.com>

components:
  # ---------------------------------------------------------------------------
  # Core stack — always deployed
  # ---------------------------------------------------------------------------
  - name: ai-stack
    required: true
    description: "Core ai-stack Helm chart with all default components"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.2.0
        valuesFiles:
          - values.yaml
    images:
      # Open WebUI
      - ghcr.io/open-webui/open-webui:v0.9.5@sha256:e045bde3b004cc7f8c319412345eb56c87ea6ac57031534a31ca37ad5424beb3
      # Ollama
      - ollama/ollama:0.24.0@sha256:a6149234667efc71d37766d61c1a16f24c33e4cd7a0bf4125c44a7e47e2419c4
      # Qdrant
      - qdrant/qdrant:v1.18.1@sha256:45f8e3ddc2570a4d029877e1b5ec1045c19b3852b4e22a55c7f43b05aea0ca89
      # Apache Tika
      - apache/tika:3.3.0.0@sha256:2a565f1ea1290bdcb74a7d35957d16a989ed44ef98790dcdcc28121d728fa583
      # SearXNG
      - searxng/searxng:2026.5.26-0037d43d8@sha256:1a9d21346437a41ddfc2286968026dddece1d4d0721625cffa2c3b00bb2f9cf3
      # Open Terminal
      - ghcr.io/open-webui/open-terminal:0.11.34@sha256:5e040fe357ce4fbd3d5e59c40247dd32172fa10c51c22ded3a7843e739d06a0e
      # Valkey
      - valkey/valkey:9.1.0@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
      # Ingestion worker
      - python:3.14-slim@sha256:c845af9399020c7e562969a13689e929074a10fd057acd1b1fad06a2fb068e97

  # ---------------------------------------------------------------------------
  # Optional: GPU Workbench
  # ---------------------------------------------------------------------------
  - name: workbench
    required: false
    description: "GPU-enabled JupyterLab workbench for ML experimentation"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.2.0
        valuesFiles:
          - values.yaml
        variables:
          - name: WORKBENCH_ENABLED
            path: workbench.enabled
            default: "true"
    images:
      - quay.io/jupyter/pytorch-notebook:cuda12-python-3.13@sha256:ad080f315dfc2e0730b8aec02330405a8fb90d42ccb1965a2bf3a4128e27dc78

  # ---------------------------------------------------------------------------
  # Optional: LangGraph agentic workflows
  # ---------------------------------------------------------------------------
  - name: langgraph
    required: false
    description: "LangGraph API server with PostgreSQL for agentic workflows"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.2.0
        valuesFiles:
          - values.yaml
        variables:
          - name: LANGGRAPH_ENABLED
            path: langgraph.enabled
            default: "true"
          - name: POSTGRES_ENABLED
            path: postgres.enabled
            default: "true"
    images:
      - docker.io/langchain/langgraph-server:0.8-py3.12@sha256:8fe3a982cd378c7ff82f623f557ee0abd4d322ddaba1e7e3317ce895c6735613
      - docker.io/library/postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88

  # ---------------------------------------------------------------------------
  # Optional: MCPO (MCP-to-OpenAPI proxy)
  # ---------------------------------------------------------------------------
  - name: mcpo
    required: false
    description: "MCPO server for MCP tool integration"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.2.0
        valuesFiles:
          - values.yaml
        variables:
          - name: MCPO_ENABLED
            path: mcpo.enabled
            default: "true"
    images:
      - ghcr.io/open-webui/mcpo:0.0.20

  # ---------------------------------------------------------------------------
  # Optional: OpenTelemetry Collector
  # ---------------------------------------------------------------------------
  - name: otel-collector
    required: false
    description: "OpenTelemetry Collector for observability"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.2.0
        valuesFiles:
          - values.yaml
        variables:
          - name: OTEL_ENABLED
            path: global.otel.enabled
            default: "true"
    images:
      - otel/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa

  # ---------------------------------------------------------------------------
  # Optional: Authelia (OIDC/SSO/MFA)
  # ---------------------------------------------------------------------------
  - name: authelia
    required: false
    description: "Authelia identity provider for OIDC/SSO/MFA"
    charts:
      - name: ai-stack
        localPath: "."
        namespace: ai-stack
        version: 2.2.0
        valuesFiles:
          - values.yaml
        variables:
          - name: AUTHELIA_ENABLED
            path: authelia.enabled
            default: "true"
    images:
      - ghcr.io/authelia/authelia:4.39.20@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b
