# =============================================================================
# values-prod.yaml — Production overlay for EU-regulated deployment
# Usage: helm install ai-stack . -f values.yaml -f values-prod.yaml
# =============================================================================

global:
  profile: prod
  imagePullPolicy: Always
  # -- Pin your storage class
  storageClass: "zfs-production"

  otel:
    enabled: true
    endpoint: "http://otel-collector.observability.svc.cluster.local:4317"

  networkPolicy:
    enabled: true

  serviceMonitor:
    enabled: true

  podAnnotations:
    assurance.platform/chart: "ai-stack"
    assurance.platform/profile: "prod"
    # control-refs is emitted per-workload by ai-stack.governanceControlRefs on
    # both the controller and the pod template (ADR-005) — no global value here,
    # which would otherwise overwrite the per-component annotation on every pod.


# External inference API providers: see HOWTO.md §6 for configuration examples.
# Use existingSecret references (ESO / Vault) in production — never inline apiKey.

openwebui:
  replicaCount: 2
  # Image tag is pinned by the chart (values.yaml) so prod tracks the
  # tested, SBOM-attested version. Do not re-pin here — it drifts.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: true
    className: "envoy"
    annotations:
      # Envoy Gateway — TLS and routing
      gateway.envoyproxy.io/tls-terminate: "true"
      # Websocket support for streaming responses
      gateway.envoyproxy.io/timeout: "300s"
      gateway.envoyproxy.io/request-body-max-size: "50m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      # Rate limiting — 60 requests per minute per client IP
      gateway.envoyproxy.io/rate-limit-local: "60"
      gateway.envoyproxy.io/rate-limit-burst: "20"
    hosts:
      # -- REQUIRED: Replace with your actual domain before deploying to production
      - host: ai.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ai-tls
        hosts:
          # -- REQUIRED: Replace with your actual domain before deploying to production
          - ai.example.com
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  persistence:
    size: 50Gi

ollama:
  replicaCount: 1
  # Image tag is pinned by the chart (values.yaml). Do not re-pin here.
  gpu:
    enabled: true
    count: 1
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 32Gi
  persistence:
    size: 200Gi

qdrant:
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    size: 100Gi

tika:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

searxng:
  settings:
    server:
      secret_key: ""  # Auto-generated from Secret; override with external secret manager
      limiter: true
      image_proxy: false

valkey:
  # Persist to a PVC so the Open WebUI session/websocket-manager and rate-limit
  # state (and any ingestion-stream backlog) survive a Valkey restart, instead of
  # logging every user out and resetting limits. RDB snapshots under /data; the
  # Deployment uses the Recreate strategy (single-replica RWO PVC). For
  # stronger durability, layer AOF (appendonly) on top -- see
  # docs/operations/RUNBOOK-remediation.md.
  persistence:
    enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

openTerminal:
  enabled: false  # Disable in prod by default; enable per-request

ingestionWorker:
  enabled: false  # Opt-in; enable when async document ingestion is needed
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

langgraph:
  enabled: false  # Opt-in; enable when agentic workloads are needed
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi

postgres:
  # Core dependency, not optional in prod: Open WebUI runs multiple replicas here
  # (openwebui.replicaCount/autoscaling above), and multi-replica Open WebUI needs
  # a shared database (DATABASE_URL) or each pod falls back to a private SQLite and
  # state splits across pods. The chart enforces this with a render-time guard
  # (ai-stack.openwebuiHaGuard). Also backs LangGraph/DBOS checkpoints when enabled.
  enabled: true
  # -- Production: use CloudNativePG for HA, automated failover, and backups.
  #    Requires: CloudNativePG operator v1.25+ installed in the cluster.
  #    Install: helm install cnpg cloudnative-pg/cloudnative-pg
  mode: cnpg
  tls:
    mode: require
  cnpg:
    instances: 3
    storage:
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi
    postgresql:
      parameters:
        shared_buffers: "1GB"
        effective_cache_size: "3GB"
        max_connections: "200"
        wal_level: "replica"
        max_wal_senders: "10"
        max_replication_slots: "10"
    backup:
      enabled: false  # Enable when S3-compatible storage is configured
      retentionPolicy: "30d"
      schedule: "0 0 2 * * *"
    pooler:
      enabled: true
      instances: 2
      type: rw
      pgbouncer:
        poolMode: transaction
        defaultPoolSize: "25"
        maxClientConn: "200"
    monitoring:
      enabled: true
