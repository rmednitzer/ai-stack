# =============================================================================
# values-prod.yaml — Production overlay for EU-regulated deployment
# Usage: helm install ai-stack . -f values.yaml -f values-prod.yaml
# =============================================================================

global:
  profile: prod
  imagePullPolicy: Always
  # -- Pin your storage class
  storageClass: "zfs-production"

  otel:
    enabled: true
    endpoint: "http://otel-collector.observability.svc.cluster.local:4317"

  networkPolicy:
    enabled: true

  serviceMonitor:
    enabled: true

  podAnnotations:
    assurance.platform/chart: "ai-stack"
    assurance.platform/profile: "prod"
    assurance.platform/control-refs: "CTL-009"

  # -- Enable backup CronJobs for stateful data
  backup:
    enabled: true
    schedule: "0 2 * * *"
    storageSize: 100Gi

# -- External inference API providers (opt-in)
# Uncomment and configure to add cloud-hosted LLM providers alongside Ollama.
# API keys should be managed via an external secret manager (ESO / Vault)
# in production — use existingSecret references instead of inline apiKey.
#
# externalAPIs:
#   enabled: true
#   providers:
#     - name: openai
#       baseUrl: "https://api.openai.com/v1"
#       existingSecret:
#         name: "openai-api-key"
#         key: "api-key"
#     - name: azure-openai
#       baseUrl: "https://my-resource.openai.azure.com/openai/deployments/gpt-4o"
#       existingSecret:
#         name: "azure-openai-api-key"
#         key: "api-key"

openwebui:
  replicaCount: 2
  image:
    tag: "v0.8.10"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: true
    className: "envoy"
    annotations:
      # Envoy Gateway — TLS and routing
      gateway.envoyproxy.io/tls-terminate: "true"
      # Websocket support for streaming responses
      gateway.envoyproxy.io/timeout: "300s"
      gateway.envoyproxy.io/request-body-max-size: "50m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      # Rate limiting — 60 requests per minute per client IP
      gateway.envoyproxy.io/rate-limit-local: "60"
      gateway.envoyproxy.io/rate-limit-burst: "20"
    hosts:
      # -- REQUIRED: Replace with your actual domain before deploying to production
      - host: ai.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ai-tls
        hosts:
          # -- REQUIRED: Replace with your actual domain before deploying to production
          - ai.example.com
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  persistence:
    size: 50Gi

ollama:
  replicaCount: 1
  image:
    tag: "0.18.2"
  gpu:
    enabled: true
    count: 1
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "16"
      memory: 64Gi
  persistence:
    size: 200Gi

qdrant:
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    size: 100Gi

tika:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

searxng:
  settings:
    server:
      secret_key: ""  # Auto-generated from Secret; override with external secret manager
      limiter: true
      image_proxy: false

workbench:
  enabled: false  # Disable in prod by default; enable per-request with GPU scheduling

valkey:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

openTerminal:
  enabled: false  # Disable in prod by default; enable per-request

pipelines:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    size: 20Gi

ingestionWorker:
  enabled: false  # Opt-in; enable when async document ingestion is needed
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

langgraph:
  enabled: false  # Opt-in; enable when agentic workloads are needed
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi

postgres:
  enabled: false  # Enable together with langgraph
  # -- Production: use CloudNativePG for HA, automated failover, and backups.
  #    Requires: CloudNativePG operator v1.25+ installed in the cluster.
  #    Install: helm install cnpg cloudnative-pg/cloudnative-pg
  mode: cnpg
  tls:
    mode: require
  cnpg:
    instances: 3
    storage:
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi
    postgresql:
      parameters:
        shared_buffers: "1GB"
        effective_cache_size: "3GB"
        max_connections: "200"
        wal_level: "replica"
        max_wal_senders: "10"
        max_replication_slots: "10"
    backup:
      enabled: false  # Enable when S3-compatible storage is configured
      retentionPolicy: "30d"
      schedule: "0 0 2 * * *"
    pooler:
      enabled: true
      instances: 2
      type: rw
      pgbouncer:
        poolMode: transaction
        defaultPoolSize: "25"
        maxClientConn: "200"
    monitoring:
      enabled: true
