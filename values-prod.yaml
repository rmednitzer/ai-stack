# =============================================================================
# values-prod.yaml — Production overlay for VMware Tanzu + Contour + Veeam K10
# Usage: helm install ai-stack . -f values.yaml -f values-prod.yaml
# =============================================================================

global:
  profile: prod
  imagePullPolicy: Always
  # -- Pin your storage class (Tanzu default or vSphere CSI)
  storageClass: "tanzu-default-storage"

  otel:
    enabled: true
    endpoint: "http://otel-collector.observability.svc.cluster.local:4317"

  networkPolicy:
    enabled: true

  serviceMonitor:
    enabled: true

  podAnnotations:
    assurance.platform/chart: "ai-stack"
    assurance.platform/profile: "prod"
    assurance.platform/control-refs: "CTL-0009"

  # -- Veeam K10 backup — managed externally via K10 policies
  backup:
    enabled: true
    frequency: "@daily"

# -- External inference API providers (opt-in)
# Uncomment and configure to add cloud-hosted LLM providers alongside Ollama.
# API keys should be managed via an external secret manager (ESO / Vault)
# in production — use existingSecret references instead of inline apiKey.
#
# externalAPIs:
#   enabled: true
#   providers:
#     - name: openai
#       baseUrl: "https://api.openai.com/v1"
#       existingSecret:
#         name: "openai-api-key"
#         key: "api-key"
#     - name: azure-openai
#       baseUrl: "https://my-resource.openai.azure.com/openai/deployments/gpt-4o"
#       existingSecret:
#         name: "azure-openai-api-key"
#         key: "api-key"

openwebui:
  replicaCount: 2
  image:
    tag: "v0.8.10"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: true
    className: "contour"
    annotations:
      # Contour / Envoy — TLS and routing
      projectcontour.io/websocket-routes: "/"
      projectcontour.io/response-timeout: "300s"
      projectcontour.io/max-request-body-size: "50m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      # Rate limiting — configure via Contour HTTPProxy RateLimitPolicy
      projectcontour.io/rate-limit-local: "60"
    hosts:
      - host: ai.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ai-tls
        hosts:
          - ai.example.com
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  persistence:
    size: 50Gi

ollama:
  replicaCount: 1
  image:
    tag: "0.18.1"
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "16"
      memory: 64Gi
  persistence:
    size: 200Gi

qdrant:
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    size: 100Gi

tika:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

searxng:
  settings:
    server:
      secret_key: ""  # Auto-generated from Secret; override with external secret manager
      limiter: true
      image_proxy: false

valkey:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

openTerminal:
  enabled: false  # Disable in prod by default; enable per-request

pipelines:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    size: 20Gi
